<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>سجلّ الدوام — النظام الرسمي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0A0F16; --surface:#131C27; --surface2:#182333; --border:#223247;
    --ink:#E7ECF2; --muted:#8A97A8; --dim:#5B6779;
    --accent:#2DD4BF; --accent-ink:#0A0F16;
    --danger:#D64545; --good:#2FAE60;
  }
  body.cmd-theme header { border-bottom-color:#123B37; }

  /* ---- Professional dashboard refresh ---- */
  .formCard, .unitCard, .shiftCard, .reqCard { box-shadow:0 10px 24px -16px #000000cc; transition:box-shadow .15s, border-color .15s; }
  .formCard:hover, .unitCard:hover { border-color:#2A3A54; }
  .kpiGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  @media (min-width:520px) { .kpiGrid { grid-template-columns:repeat(4,1fr); } }
  .kpiCard { position:relative; background:linear-gradient(160deg,#141F2E 0%,#101826 100%); border:1px solid #1E2B41; border-radius:14px; padding:14px 14px 12px; overflow:hidden; box-shadow:0 10px 24px -16px #000000cc; }
  .kpiCard::before { content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--kpi-color,var(--accent)); }
  .kpiIcon { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; background:color-mix(in srgb, var(--kpi-color,var(--accent)) 18%, transparent); margin-bottom:8px; }
  .kpiValue { font-size:24px; font-weight:900; font-family:'Cairo',sans-serif; line-height:1.1; color:var(--kpi-color,var(--ink)); }
  .kpiLabel { font-size:11.5px; color:var(--muted); margin-top:3px; }

  /* ---- Sidebar navigation ---- */
  .hamburgerBtn { background:none; border:1px solid #2A3547; color:var(--ink); border-radius:9px; width:38px; height:38px; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cmdSplash { position:fixed; inset:0; z-index:200; background:radial-gradient(circle at 50% 40%, #1A2438 0%, #0A0F16 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; opacity:1; transition:opacity .35s ease; }
  .cmdSplash.out { opacity:0; }
  .cmdSplash .splashSeal { width:88px; height:88px; animation:splashPulse 1.8s ease-in-out infinite; filter:drop-shadow(0 0 18px rgba(45,212,191,.5)); }
  @keyframes splashPulse { 0%,100% { transform:scale(1); opacity:.92; } 50% { transform:scale(1.06); opacity:1; } }
  .cmdSplash .splashTitle { font-family:'Cairo',sans-serif; font-weight:800; font-size:19px; color:#F0E6D2; letter-spacing:.5px; animation:splashFadeUp .6s ease both; }
  .cmdSplash .splashSub { font-size:12px; color:#8A97A8; animation:splashFadeUp .6s .1s ease both; }
  @keyframes splashFadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .cmdSplash .splashBar { width:130px; height:3px; border-radius:3px; background:#1E2B41; overflow:hidden; margin-top:4px; }
  .cmdSplash .splashBar::after { content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg,#2DD4BF,#4ADE80); border-radius:3px; animation:splashSlide 1.1s ease-in-out infinite; }
  @keyframes splashSlide { 0% { transform:translateX(-120%); } 100% { transform:translateX(360%); } }
  .sidebarBackdrop { position:fixed; inset:0; background:#000000a0; opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
  .sidebarBackdrop.open { opacity:1; pointer-events:auto; }
  .sidebarNav { position:fixed; top:0; bottom:0; right:0; width:min(78vw,290px); background:#0E1622; border-left:1px solid var(--border); z-index:50; transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:-14px 0 40px -20px #000c; }
  .sidebarNav.open { transform:translateX(0); }
  .sidebarHead { padding:18px 16px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sidebarBrand { font-weight:800; font-size:15px; font-family:'Cairo',sans-serif; }
  .sidebarClose { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .sidebarList { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:3px; }
  .sideTabBtn { display:flex; align-items:center; gap:10px; background:none; border:none; color:#B9C3D1; font-weight:700; font-size:14px; text-align:start; padding:11px 12px; border-radius:10px; cursor:pointer; border-inline-start:3px solid transparent; }
  .sideTabBtn.active { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--ink); border-inline-start-color:var(--accent); }
  .sidebarFoot { padding:12px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--dim); }
  .roleTag { display:inline-block; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px; margin-inline-start:8px; vertical-align:middle; }
  .roleTag.cmd { background:#0B2E2B; border:1px solid #2DD4BF; color:#2DD4BF; }
  .roleTag.member { background:#0B2E2B; border:1px solid #2DD4BF; color:#2DD4BF; }
  * { box-sizing: border-box; font-family:'Tajawal', 'Tahoma', sans-serif; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); background-image:radial-gradient(circle at 50% 0%, #101826 0%, var(--bg) 60%); }
  h1, h2, h3, .brand, .dutyUnit, button, .tabBtn, .unitTitle { font-family:'Cairo','Tajawal',sans-serif; }
  .mono { font-family:'JetBrains Mono', monospace; letter-spacing:0.5px; }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .35s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 24px; width:100%; max-width:360px; text-align:center; box-shadow:0 20px 40px -20px #000000aa; }
  .seal { width:56px; height:56px; margin:0 auto 12px; display:block; }
  .officialTag { font-size:10.5px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin:-10px 0 16px; font-family:'JetBrains Mono',monospace; }
  h1 { font-size:19px; margin:0 0 6px; font-weight:800; }
  p { color:var(--muted); font-size:13px; margin-bottom:20px; line-height:1.6; }
  input, select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--ink); border-radius:9px; padding:11px 12px; font-size:14px; margin-bottom:10px; transition:border-color .15s; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); border:none; color:var(--accent-ink); font-weight:800; border-radius:9px; padding:12px 16px; font-size:14px; cursor:pointer; transition:filter .15s, transform .1s; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.55; cursor:default; transform:none; }
  .err { color:var(--danger); font-size:12px; margin-top:8px; }
  .ghost { background:none; border:1px solid #3A4658; color:#C7D0DC; }
  header { position:sticky; top:0; background:#0A0F16ee; backdrop-filter:blur(8px); border-bottom:1px solid var(--border); z-index:10; }
  .headerTop { padding:14px 16px 0; display:flex; justify-content:space-between; align-items:center; }
  .brand { font-weight:800; font-size:16px; letter-spacing:.3px; }
  .tabs { display:flex; gap:16px; padding:10px 16px 0; }
  .tabBtn { background:none; border:none; color:var(--ink); font-weight:700; font-size:13.5px; padding:8px 2px 10px; cursor:pointer; border-bottom:2px solid transparent; opacity:.5; transition:opacity .15s; }
  .tabBtn.active { opacity:1; border-bottom-color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .rosterGrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:14px; }
  .unitCard { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:16px; }
  .unitTitle { font-weight:800; font-size:17px; margin-bottom:4px; background:transparent; border:none; border-bottom:2px solid #2A3547; color:#E7ECF2; width:100%; padding:4px 2px; }
  .memberRow { background:#0F1720; border:1px solid #1E2B41; border-radius:10px; padding:8px; margin-bottom:8px; }
  .memberRowTop { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13.5px; font-weight:700; }
  .pinTag { font-size:11px; color:#8A97A8; background:#141F2E; border-radius:6px; padding:3px 7px; cursor:pointer; }
  .addRow { display:flex; gap:6px; margin-top:10px; }
  .addRow input { margin-bottom:0; flex:1; }
  .xbtn { background:none; border:none; color:#5B6779; cursor:pointer; font-size:14px; padding:2px 6px; }
  .empty { color:#5B6779; font-size:13px; padding:26px 10px; text-align:center; background:#141F2E; border:1px dashed #2A3547; border-radius:10px; }
  .empty::before { content:"🗂️"; display:block; font-size:26px; margin-bottom:8px; opacity:.6; }
  .empty::before { content:"🗂️"; display:block; font-size:26px; margin-bottom:8px; opacity:.7; }
  .loading { color:#8A97A8; text-align:center; padding:20px 10px; position:relative; animation:loadingPulse 1.3s ease-in-out infinite; }
  @keyframes loadingPulse { 0%,100%{opacity:.45} 50%{opacity:1} }

  .skeletonWrap { display:flex; flex-direction:column; gap:12px; padding:4px 0; }
  .skelCard {
    height:64px; border-radius:14px; background:rgba(15,22,33,.4);
    border:1px solid rgba(45,212,191,.12); position:relative; overflow:hidden;
  }
  .skelCard::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(45,212,191,.14), transparent);
    transform:translateX(-100%); animation:skelShine 1.5s infinite;
  }
  @keyframes skelShine { 100% { transform:translateX(100%); } }

  /* ---- Offline banner ---- */
  #offlineBanner {
    position:fixed; top:0; inset-inline:0; z-index:9998; text-align:center; padding:8px;
    background:#D64545; color:#fff; font-size:12.5px; font-weight:800; display:none;
  }
  body.is-offline #offlineBanner { display:block; }

  /* ---- Idle lock overlay ---- */
  #idleLockOverlay {
    position:fixed; inset:0; z-index:99999; display:none; align-items:center; justify-content:center;
    background:rgba(6,10,15,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); text-align:center;
  }
  #idleLockOverlay.show { display:flex; }

  /* ---- Empty state ---- */
  .emptyState { text-align:center; padding:34px 16px; color:#8A97A8; }
  .emptyState .esIcon { font-size:34px; margin-bottom:10px; opacity:.7; }
  .emptyState .esText { font-size:13px; }
  .skeleton { background:linear-gradient(90deg,#141F2E 25%,#1E2B41 37%,#141F2E 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite; border-radius:10px; }
  @keyframes skeletonShine { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
  .skeletonRow { height:64px; margin-bottom:10px; }
  .skeletonWrap .skeletonRow:nth-child(2) { opacity:.75; } .skeletonWrap .skeletonRow:nth-child(3) { opacity:.5; }

  /* ---- Toasts ---- */
  .toast {
    pointer-events:auto; min-width:200px; max-width:88vw; background:rgba(15,22,33,.85); backdrop-filter:blur(18px);
    border:1px solid rgba(45,212,191,.3); border-radius:12px; padding:11px 16px; font-size:13px; font-weight:700; color:#fff;
    box-shadow:0 14px 34px -14px #000000dd; display:flex; align-items:center; gap:8px;
    animation:toastIn .25s ease, toastOut .3s ease 2.5s forwards;
  }
  .toast.ok { border-color:rgba(74,222,128,.5); } .toast.err { border-color:rgba(214,69,69,.5); }
  @keyframes toastIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { to{opacity:0;transform:translateY(-8px)} }

  /* ---- QR / serial badge ---- */
  .qrBox { display:flex; align-items:center; gap:12px; background:rgba(45,212,191,.06); border:1px solid rgba(45,212,191,.2); border-radius:12px; padding:10px; margin-bottom:12px; }
  .qrBox img { width:64px; height:64px; border-radius:8px; background:#fff; padding:3px; flex-shrink:0; }
  .qrBox .serialNum { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:800; color:#2DD4BF; letter-spacing:1px; }
  .dateBar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .dateMain { font-weight:800; font-size:15px; }
  .iconbtn { background:#172236; border:1px solid #2A3547; color:#E7ECF2; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:16px; }
  .linkbtn { background:none; border:none; color:#2DD4BF; font-size:12px; cursor:pointer; text-decoration:underline; }
  .dutyBanner { display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg,#08211E,#0F1720); border:1px solid #134E4A; border-radius:12px; padding:12px 16px; margin-bottom:14px; }
  .dutyLabel { font-size:12px; color:#5EEAD4; }
  .dutyUnit { font-weight:800; font-size:17px; color:#4ADE80; }
  .shiftGrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:12px; }
  .shiftCard { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:12px; }
  .shiftHeader { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2A3547; padding-bottom:8px; margin-bottom:10px; font-weight:800; }
  .pillsRow { display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; }
  .pill { border:1.5px solid; border-radius:8px; padding:5px 8px; cursor:pointer; font-size:12px; background:transparent; font-weight:700; }
  .pill.active { color:#0F1720; }
  .assignChip { background:#1E2B41; border:1px dashed #3A4658; color:#C7D0DC; border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; margin:3px; }
  .verifyBox { display:flex; align-items:center; gap:6px; background:#06201D; border:1px solid #134E4A; border-radius:8px; padding:6px 8px; margin-top:6px; }
  .verifyBox input { width:70px; margin:0; padding:5px 6px; font-size:13px; letter-spacing:2px; }
  .miniBtn { background:#2DD4BF; border:none; color:#0F1720; font-weight:800; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .miniBtnGhost { background:none; border:1px solid #3A4658; color:#C7D0DC; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .timeRow { display:flex; align-items:center; gap:6px; margin-top:8px; border-top:1px dashed #2A3547; padding-top:6px; font-size:12px; color:#8A97A8; }
  .timeRow input[type=time] { width:auto; margin:0; padding:3px 6px; font-size:12px; }
  .geoLink { font-size:11px; color:#3B82C4; display:block; margin-top:4px; }
  .geoNote { font-size:11px; color:#5B6779; margin-top:4px; }
  .formCard { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:16px; margin-bottom:16px; }
  .formRow { display:flex; gap:8px; flex-wrap:wrap; }
  .formRow > * { flex:1; min-width:140px; }
  .reqCard { background:#141F2E; border:1px solid #1E2B41; border-radius:12px; padding:14px; margin-bottom:8px; }
  .reqTop { display:flex; justify-content:space-between; align-items:flex-start; }
  .reqBottom { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .badge { font-size:12px; border-radius:20px; padding:3px 10px; border:1px solid; }
  .approveBtn { background:#0F2A1B; border:1px solid #2FAE60; color:#2FAE60; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:700; }
  .rejectBtn { background:#2A1414; border:1px solid #D64545; color:#D64545; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:700; }
  .platoonCard { background:#101A28; border:1px solid #24334A; border-radius:12px; padding:12px; margin-top:12px; }
  .platoonHead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .platoonHead input.unitTitle { font-size:15px; border-bottom:2px solid #24334A; }
  .cmdRow { display:flex; align-items:center; gap:6px; font-size:12px; color:#8A97A8; margin-bottom:10px; }
  .cmdRow select { margin:0; padding:5px 6px; font-size:12px; flex:1; }
  .squadCard { background:#0F1720; border:1px solid #1E2B41; border-radius:10px; padding:10px; margin-top:8px; }
  .squadHead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .squadHead input.unitTitle { font-size:13.5px; border-bottom:2px solid #1E2B41; }
  .smallMember { display:flex; justify-content:space-between; align-items:center; background:#141F2E; border-radius:8px; padding:6px 8px; margin-bottom:5px; font-size:12.5px; }
  .unassignedBox { border:1px dashed #3A4658; border-radius:10px; padding:10px; margin-top:12px; }
  .smallBtn { background:#1E2B41; border:1px dashed #3A4658; color:#C7D0DC; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; margin:2px; }
  .rosterTable { width:100%; border-collapse:collapse; font-size:12.5px; }
  .rosterTable th, .rosterTable td { border-bottom:1px solid #1E2B41; padding:9px 7px; text-align:right; white-space:nowrap; }
  .rosterTable th { color:#8A97A8; font-weight:700; font-size:11.5px; }
  .rosterTable tbody tr:hover { background:#141F2E; }
  .rosterFilters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .rosterFilters select { flex:1; min-width:110px; margin:0; }
  .pagerRow { display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:12px; color:#8A97A8; }
  .planBox { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:14px; margin-bottom:14px; }
  .planRow { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed #1E2B41; }
  .planRow:last-child { border-bottom:none; }
  .planRow select { margin:0; padding:6px 8px; font-size:12.5px; width:auto; min-width:130px; }
  .leftoverBox { border:1px dashed #3A4658; border-radius:10px; padding:10px; margin-top:12px; }

  /* ---- Glass auth screen (individual entry / login) ---- */
  .authScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background-image:linear-gradient(180deg, rgba(4,8,14,.55), rgba(4,8,14,.8)), url('bg-shield.jpg'); background-size:cover; background-position:center; }
  .glassCard { width:100%; max-width:380px; background:rgba(20,32,50,0.42); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.18); border-radius:22px; padding:34px 26px; box-shadow:0 25px 60px -18px rgba(0,0,0,0.65); text-align:center; }
  .glassCard .seal { filter:drop-shadow(0 0 10px rgba(45,212,191,.4)); }
  .glassCard h1 { color:#fff; font-size:21px; margin:0 0 6px; font-weight:800; }
  .glassCard .officialTag { color:rgba(255,255,255,.6); }
  .glassCard p { color:rgba(255,255,255,.75); }
  .glassField { text-align:right; margin-bottom:20px; }
  .glassField label { display:block; font-size:11.5px; color:rgba(255,255,255,.72); margin-bottom:7px; }
  .glassField .inputWrap { position:relative; }
  .glassField input { width:100%; background:transparent; border:none; border-bottom:1.5px solid rgba(255,255,255,.38); color:#fff; padding:5px 24px 9px 2px; font-size:14.5px; border-radius:0; margin-bottom:0; }
  .glassField input::placeholder { color:rgba(255,255,255,.4); }

  function getOnDutyUnitId(units, rotation, dateISO) {
    const anchor = new Date(rotation.date+"T00:00:00");
    const target = new Date(dateISO+"T00:00:00");
    const diffDays = Math.round((target - anchor) / 86400000);
    const weekIndex = Math.floor(diffDays / 7);
    const other = units.find(u => u.id !== rotation.onDutyUnit)?.id || rotation.onDutyUnit;
    const parity = ((weekIndex % 2) + 2) % 2;
    return parity === 0 ? rotation.onDutyUnit : other;
  }
  function getWeekStart(dateISO, rotation) {
    const anchor = new Date(rotation.date+"T00:00:00");
    const target = new Date(dateISO+"T00:00:00");
    const diffDays = Math.round((target - anchor) / 86400000);
    const weekIndex = Math.floor(diffDays / 7);
    const start = new Date(anchor.getTime() + weekIndex * 7 * 86400000);
    return `${start.getFullYear()}-${pad(start.getMonth()+1)}-${pad(start.getDate())}`;
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function haversineDistanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function genUniquePin(usedSet) {

  function parseImportFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          resolve(rows);
        } catch (err) { reject(err); }
      };
      reader.onerror = () => reject(new Error("تعذّرت قراءة الملف"));
      reader.readAsArrayBuffer(file);
    });
  }

  function resolveImportRows(rawRows) {
    if (!rawRows.length) return [];
    const sampleKeys = Object.keys(rawRows[0]);
    const nameKey = sampleKeys.find(k => k.includes("اسم"));
    const unitKey = sampleKeys.find(k => k.includes("سرية"));
    const platoonKey = sampleKeys.find(k => k.includes("فصيلة"));
    const squadKey = sampleKeys.find(k => k.includes("مجموعة"));
    const seenInFile = new Set();

    return rawRows.map((row, idx) => {
      const name = nameKey ? String(row[nameKey] || "").trim() : "";
      const unitName = unitKey ? String(row[unitKey] || "").trim() : "";
      const platoonName = platoonKey ? String(row[platoonKey] || "").trim() : "";
      const squadName = squadKey ? String(row[squadKey] || "").trim() : "";
      const result = { rowNum: idx + 2, name, unitName, platoonName, squadName, status: "", reason: "", unit_id: null, squad_id: null, existingMemberId: null };

      if (!name) { result.status = "error"; result.reason = "بدون اسم"; return result; }
      if (!nameKey) { result.status = "error"; result.reason = "ما لقيت عمود «الاسم» بالملف"; return result; }
      if (seenInFile.has(name)) { result.status = "error"; result.reason = "الاسم مكرر أكثر من مرة بنفس الملف"; return result; }
      seenInFile.add(name);

      if (!unitName) { result.status = "error"; result.reason = "بدون سرية"; return result; }
      const unit = UNITS.find(u => u.name.trim() === unitName);
      if (!unit) { result.status = "error"; result.reason = `السرية «${unitName}» غير موجودة`; return result; }
      result.unit_id = unit.id;

      let platoon = null;
      if (platoonName) {
        platoon = PLATOONS.find(p => p.unit_id === unit.id && p.name.trim() === platoonName);
        if (!platoon) { result.status = "error"; result.reason = `الفصيلة «${platoonName}» غير موجودة بسرية «${unitName}»`; return result; }
      }
      if (squadName) {
        if (!platoon) { result.status = "error"; result.reason = "المجموعة محددة بدون فصيلة"; return result; }
        const squad = SQUADS.find(s => s.platoon_id === platoon.id && s.name.trim() === squadName);
        if (!squad) { result.status = "error"; result.reason = `المجموعة «${squadName}» غير موجودة بفصيلة «${platoonName}»`; return result; }
        result.squad_id = squad.id;
      }

      const matches = MEMBERS.filter(m => m.name.trim() === name);
      if (matches.length > 1) { result.status = "error"; result.reason = "الاسم مكرر بعدة أفراد موجودين مسبقًا — راجعيه يدويًا"; return result; }
      if (matches.length === 1) { result.status = "update"; result.existingMemberId = matches[0].id; }
      else { result.status = "new"; }
      return result;
    });
  }

  async function executeImport(rows) {
    const usedPins = new Set(MEMBERS.map(m => m.pin));
    const toInsert = rows.filter(r => r.status === "new").map(r => ({ unit_id: r.unit_id, squad_id: r.squad_id, name: r.name, pin: genUniquePin(usedPins) }));
    const toUpdate = rows.filter(r => r.status === "update").map(r => ({ id: r.existingMemberId, unit_id: r.unit_id, squad_id: r.squad_id, name: r.name }));

    let insertError = null, updateError = null;
    if (toInsert.length) {
      const { error } = await sb.from("members").insert(toInsert);
      insertError = error;
    }
    if (toUpdate.length && !insertError) {
      const { error } = await sb.from("members").upsert(toUpdate, { onConflict: "id" });
      updateError = error;
    }
    return {
      insertError, updateError,
      insertedCount: insertError ? 0 : toInsert.length,
      updatedCount: updateError ? 0 : toUpdate.length,
    };
  }

  function wireImportEvents(main) {
    const toggle = document.getElementById("importToggle");
    if (toggle) toggle.addEventListener("click", () => {
      importPanelOpen = !importPanelOpen;
      if (!importPanelOpen) importPreviewRows = [];
      rerenderRosterLocal();
    });

    const previewBtn = document.getElementById("importPreviewBtn");
    if (previewBtn) previewBtn.onclick = async () => {
      const fileInput = document.getElementById("importFileInput");
      const file = fileInput.files[0];
      if (!file) { alert("اختاري ملف أول."); return; }
      previewBtn.disabled = true; previewBtn.textContent = "...جارِ القراءة";
      try {
        const rawRows = await parseImportFile(file);
        importPreviewRows = resolveImportRows(rawRows);
      } catch (err) {
        alert("صار خطأ بقراءة الملف: " + err.message);
      }
      previewBtn.disabled = false; previewBtn.textContent = "معاينة الملف";
      rerenderRosterLocal();
    };

    const confirmBtn = document.getElementById("importConfirmBtn");
    if (confirmBtn) confirmBtn.onclick = async () => {
      const statusEl = document.getElementById("importStatus");
      confirmBtn.disabled = true; confirmBtn.textContent = "...جارِ التنفيذ";
      const result = await executeImport(importPreviewRows);
      confirmBtn.disabled = false;
      if (result.insertError || result.updateError) {
        statusEl.style.color = "#D64545";
        statusEl.textContent = "صار خطأ: " + (result.insertError?.message || result.updateError?.message);
      } else {
        statusEl.style.color = "#2FAE60";
        statusEl.textContent = `✔ تم! أُضيف ${result.insertedCount} فرد جديد، وتحدّث ${result.updatedCount} فرد.`;
        importPreviewRows = [];
        await refreshRosterData();
        setTimeout(() => { importPanelOpen = false; rerenderRosterLocal(); }, 2500);
      }
    };
  }

  function getFilteredRosterMembers() {
    let list = MEMBERS.slice();
    if (rosterFilterUnit) list = list.filter(m => m.unit_id === rosterFilterUnit);
    if (rosterFilterSquad) {
      list = list.filter(m => m.squad_id === rosterFilterSquad);
    } else if (rosterFilterPlatoon) {
      const squadIds = new Set(SQUADS.filter(s => s.platoon_id === rosterFilterPlatoon).map(s => s.id));
      list = list.filter(m => squadIds.has(m.squad_id));
    }
    if (rosterFilterText.trim()) {
      const q = rosterFilterText.trim();
      list = list.filter(m => m.name.includes(q));
    }
    return list.slice().sort((a, b) => a.name.localeCompare(b.name, "ar"));
  }

  function renderMemberTableSection() {
    const filtered = getFilteredRosterMembers();
    const totalPages = Math.max(1, Math.ceil(filtered.length / ROSTER_PAGE_SIZE));
    if (rosterPage > totalPages) rosterPage = totalPages;
    if (rosterPage < 1) rosterPage = 1;
    const startIdx = (rosterPage - 1) * ROSTER_PAGE_SIZE;
    const pageItems = filtered.slice(startIdx, startIdx + ROSTER_PAGE_SIZE);

    const nameCounts = {};
    MEMBERS.forEach(m => { const k = (m.name||"").trim(); nameCounts[k] = (nameCounts[k]||0) + 1; });
    const dupCount = Object.values(nameCounts).filter(c => c > 1).length;

    const platoonOptions = PLATOONS.filter(p => !rosterFilterUnit || p.unit_id === rosterFilterUnit);
    const platoonOptionIds = new Set(platoonOptions.map(p => p.id));
    const squadOptions = SQUADS.filter(s => {
      if (rosterFilterPlatoon) return s.platoon_id === rosterFilterPlatoon;
      if (rosterFilterUnit) return platoonOptionIds.has(s.platoon_id);
      return true;
    });

    const rowsHtml = pageItems.length === 0
      ? `<tr><td colspan="7" style="text-align:center;color:#5B6779;padding:16px">لا يوجد أفراد مطابقين</td></tr>`
      : pageItems.map((m, i) => {
          const squad = SQUADS.find(s => s.id === m.squad_id);
          const platoon = squad ? PLATOONS.find(p => p.id === squad.platoon_id) : null;
          const unit = UNITS.find(u => u.id === m.unit_id);
          const isDup = nameCounts[(m.name||"").trim()] > 1;
          const isChecked = selectedMemberIds.has(m.id);
          return `
            <tr data-tablerow="${m.id}" style="cursor:pointer;${isDup ? 'background:rgba(214,69,69,.08)' : ''}">
              <td onclick="event.stopPropagation()"><input type="checkbox" class="rowSelectCb" data-selid="${m.id}" ${isChecked ? "checked" : ""} style="width:auto" /></td>
              <td>${startIdx + i + 1}</td>
              <td>${roleIcon(m.role)} ${escapeHtml(m.name)} ${isDup ? '<span style="color:#D64545;font-size:10px;font-weight:800">⚠️ مكرر</span>' : ""}</td>
              <td>${escapeHtml(unit?.name || "—")}</td>
              <td>${escapeHtml(platoon?.name || "—")}</td>
              <td>${escapeHtml(squad?.name || "غير مصنّف")}</td>
              <td><span class="pinTag" data-showpin="${m.id}" data-pin="${escapeHtml(m.pin)}">••••</span></td>
            </tr>
          `;
        }).join("");

    return `
      <div class="formCard">
        <div style="font-weight:800;margin-bottom:10px">👥 كل الأفراد (${filtered.length})</div>
        ${dupCount > 0 ? `
          <div style="background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.35);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span>⚠️ في ${dupCount} اسم مكرر بالجدول</span>
            <button class="miniBtn" id="selectDupsBtn">حدّد كل المكررين</button>
          </div>` : ""}
        <div class="rosterFilters">
          <select id="tblFilterUnit">
            <option value="">كل السرايا</option>
            ${UNITS.map(u => `<option value="${u.id}" ${u.id === rosterFilterUnit ? "selected" : ""}>${escapeHtml(u.name)}</option>`).join("")}
          </select>
          <select id="tblFilterPlatoon">
            <option value="">كل الفصائل</option>
            ${platoonOptions.map(p => `<option value="${p.id}" ${p.id === rosterFilterPlatoon ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}
          </select>
          <select id="tblFilterSquad">
            <option value="">كل المجموعات</option>
            ${squadOptions.map(s => `<option value="${s.id}" ${s.id === rosterFilterSquad ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("")}
          </select>
        </div>
        <input type="text" id="tblFilterText" placeholder="فلترة بالاسم..." value="${escapeHtml(rosterFilterText)}" style="margin-bottom:4px" />
        <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="selectAllCb" style="width:auto" /> تحديد كل الصفحة</label>
          <span id="selCountLabel" style="color:#8A97A8">${selectedMemberIds.size} محدد</span>
        </div>
        ${selectedMemberIds.size > 0 ? `<button id="bulkDeleteBtn" style="width:100%;background:#D64545;border-color:#D64545;margin-bottom:10px">🗑️ حذف المحدّد (${selectedMemberIds.size})</button>` : ""}
        <div style="overflow-x:auto">
          <table class="rosterTable">
            <thead><tr><th></th><th>#</th><th>الاسم</th><th>السرية</th><th>الفصيلة</th><th>المجموعة</th><th>الرمز</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        <div class="pagerRow">
          <button class="smallBtn" id="tblPrevPage" ${rosterPage <= 1 ? "disabled" : ""}>‹ السابق</button>
          <span>صفحة ${rosterPage} من ${totalPages}</span>
          <button class="smallBtn" id="tblNextPage" ${rosterPage >= totalPages ? "disabled" : ""}>التالي ›</button>
        </div>
      </div>
    `;
  }

  function wireMemberTableEvents(main) {
    const uSel = document.getElementById("tblFilterUnit");
    const pSel = document.getElementById("tblFilterPlatoon");
    const sSel = document.getElementById("tblFilterSquad");
    const tInput = document.getElementById("tblFilterText");
    if (uSel) uSel.onchange = () => { rosterFilterUnit = uSel.value; rosterFilterPlatoon = ""; rosterFilterSquad = ""; rosterPage = 1; rerenderRosterLocal(); };
    if (pSel) pSel.onchange = () => { rosterFilterPlatoon = pSel.value; rosterFilterSquad = ""; rosterPage = 1; rerenderRosterLocal(); };
    if (sSel) sSel.onchange = () => { rosterFilterSquad = sSel.value; rosterPage = 1; rerenderRosterLocal(); };
    if (tInput) tInput.oninput = () => { rosterFilterText = tInput.value; rosterPage = 1; rerenderRosterLocal(); };
    const prevBtn = document.getElementById("tblPrevPage");
    const nextBtn = document.getElementById("tblNextPage");
    if (prevBtn) prevBtn.onclick = () => { rosterPage--; rerenderRosterLocal(); };
    if (nextBtn) nextBtn.onclick = () => { rosterPage++; rerenderRosterLocal(); };
    main.querySelectorAll("[data-tablerow]").forEach(row => row.addEventListener("click", (e) => {
      if (e.target.closest("[data-showpin]") || e.target.closest(".rowSelectCb")) return;
      renderMemberDetailCard(row.getAttribute("data-tablerow"));
    }));

    main.querySelectorAll(".rowSelectCb").forEach(cb => {
      cb.addEventListener("change", () => {
        const id = cb.getAttribute("data-selid");
        if (cb.checked) selectedMemberIds.add(id); else selectedMemberIds.delete(id);
        rerenderRosterLocal();
      });
    });
    const selectAllCb = document.getElementById("selectAllCb");
    if (selectAllCb) selectAllCb.onchange = () => {
      const filtered = getFilteredRosterMembers();
      const startIdx = (rosterPage - 1) * ROSTER_PAGE_SIZE;
      const pageItems = filtered.slice(startIdx, startIdx + ROSTER_PAGE_SIZE);
      pageItems.forEach(m => { if (selectAllCb.checked) selectedMemberIds.add(m.id); else selectedMemberIds.delete(m.id); });
      rerenderRosterLocal();
    };
    const selectDupsBtn = document.getElementById("selectDupsBtn");
    if (selectDupsBtn) selectDupsBtn.onclick = () => {
      const nameCounts = {};
      MEMBERS.forEach(m => { const k = (m.name||"").trim(); nameCounts[k] = (nameCounts[k]||0) + 1; });
      MEMBERS.forEach(m => { if (nameCounts[(m.name||"").trim()] > 1) selectedMemberIds.add(m.id); });
      rerenderRosterLocal();
    };
    const bulkDeleteBtn = document.getElementById("bulkDeleteBtn");
    if (bulkDeleteBtn) bulkDeleteBtn.onclick = async () => {
      const count = selectedMemberIds.size;
      if (!confirm(`متأكد إنك بدك تحذف ${count} فرد نهائيًا؟ هالإجراء ما بينرجع.`)) return;
      bulkDeleteBtn.disabled = true; bulkDeleteBtn.textContent = "...جارِ الحذف";
      const ids = Array.from(selectedMemberIds);
      const { error } = await sb.from("members").delete().in("id", ids);
      if (error) { showToast("صار خطأ أثناء الحذف: " + (error.message || ""), "err"); bulkDeleteBtn.disabled = false; return; }
      await logAudit("حذف جماعي لأفراد", `${count} فرد`);
      selectedMemberIds.clear();
      showToast(`تم حذف ${count} فرد`, "ok");
      await refreshRosterData();
      renderRoster();
    };
  }

  const dayShortAr = (iso) => ["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"][new Date(iso+"T00:00:00").getDay()];
  function getSundayWeekStart(dateISO) {
    const d = new Date(dateISO + "T00:00:00");
    d.setDate(d.getDate() - d.getDay());
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  async function exportWeeklyExcelReport(weekStartISO) {
    const weekEndISO = addDays(weekStartISO, 6);
    const records = await loadAttendanceRange(weekStartISO, weekEndISO);
    const byDateMember = {};
    records.forEach(r => { (byDateMember[r.date] ||= {})[r.member_id] = r.status; });

    const days = Array.from({length:7}, (_, i) => addDays(weekStartISO, i));
    const header = ["الاسم", "السرية", "الفصيلة", "المجموعة", ...days.map(d => `${dayShortAr(d)} ${d.slice(5)}`), "أيام الحضور", "أيام الغياب", "نسبة الحضور %"];

    const rows = MEMBERS.map(m => {
      const unit = UNITS.find(u => u.id === m.unit_id);
      const squad = SQUADS.find(s => s.id === m.squad_id);
      const platoon = squad ? PLATOONS.find(p => p.id === squad.platoon_id) : null;
      let presentCount = 0, absentCount = 0;
      const dayCells = days.map(d => {

        if (st === "absent") { absentCount++; return "غايب"; }
        if (st && REQUEST_TYPES.includes(st)) return STATUS[st].label;

      });
      const pct = Math.round((presentCount/7)*100);
      return [m.name, unit?.name||"", platoon?.name||"", squad?.name||"", ...dayCells, presentCount, absentCount, pct];
    });

  }

    const haversine = (a, b) => {
      const R = 6371000, toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
      const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
    };
    async function fetchRoadRoute(a, b) {
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;

        if (data.code === "Ok" && data.routes && data.routes[0]) {
          const r = data.routes[0];
          return { distance_m: r.distance, geometry: r.geometry.coordinates.map(([lng, lat]) => [lat, lng]), real: true };
        }
      } catch (e) { /* هيك رح نرجع للخط المستقيم بالأسفل */ }
      return { distance_m: haversine(a, b), geometry: [[a.lat, a.lng], [b.lat, b.lng]], real: false };

        <div style="font-size:12.5px;color:#8A97A8">لازم تشغّل سكربت إنشاء جدول route_edges بـSupabase SQL Editor حتى تقدر تربط النقاط وتحسب أقصر مسار.</div>
      </div>` : `
      <div class="formCard">
        <div style="font-weight:800;margin-bottom:6px">🔗 ربط نقطتين بمسار</div>
        <div style="font-size:12px;color:#8A97A8;margin-bottom:10px">اربط كل نقطتين متجاورتين فعليًا — رح نجيب المسار الحقيقي عبر الطريق تلقائيًا (مو خط مستقيم فوق البيوت).</div>
        <select id="edgeFromSel" style="margin-bottom:8px"><option value="">— من نقطة —</option>${(points||[]).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select>

        ${edgeList.some(e => !e.geometry) ? `<button class="ghost" id="refreshEdgesBtn" style="width:100%;margin-top:8px">🔄 حدّث الروابط القديمة للطريق الحقيقي</button>` : ""}
        <div id="edgeRefreshStatus" style="font-size:11.5px;color:#8A97A8;margin-top:6px"></div>
        <div id="edgesList" style="margin-top:12px">
          ${edgeList.length === 0 ? emptyState("🔗", "ما في روابط بعد.") : edgeList.map(e => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px">
              <div>${e.geometry ? "🛣️" : "📏"} ${escapeHtml(pointById[e.point_a]?.name || "؟")} ↔ ${escapeHtml(pointById[e.point_b]?.name || "؟")} <span style="color:#8A97A8">(${Math.round(e.distance_m)} م${e.geometry ? "" : " — تقريبي"})</span></div>
              <button class="xbtn" data-deledge="${e.id}">🗑️</button>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="formCard">
        <div style="font-weight:800;margin-bottom:6px">🧭 احسب أقصر مسار</div>
        <select id="routeFromSel" style="margin-bottom:8px"><option value="">— نقطة الانطلاق —</option>${(points||[]).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select>
        <select id="routeToSel" style="margin-bottom:10px"><option value="">— الوجهة —</option>${(points||[]).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select>
        <button id="calcRouteBtn" style="width:100%">🧭 احسب أقصر مسار</button>
        <div id="routeResult" style="margin-top:12px;font-size:13px"></div>
      </div>
      `}
    `;

    const centerLat = points?.[0]?.lat ?? BASE_LOCATION?.lat ?? 33.8886;
    const centerLng = points?.[0]?.lng ?? BASE_LOCATION?.lng ?? 35.4955;
    const map = L.map("routesMap", { zoomControl: true }).setView([centerLat, centerLng], points?.length ? 17 : (BASE_LOCATION ? 17 : 8));
    const streetLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { attribution: "© OpenStreetMap © CARTO", subdomains: "abcd" }).addTo(map);
    const satLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "© Esri" });
    let satOn = false;

    const markerIcon = (kind) => {
      const c = kind === "internal" ? "#4ADE80" : "#3B82C4";
      return L.divIcon({
        className: "",
        html: `<div style="position:relative;width:16px;height:16px">
          <div style="position:absolute;inset:-8px;border-radius:50%;background:${c};opacity:.35;animation:mapPulse 2s ease-out infinite"></div>
          <div style="position:absolute;inset:0;width:16px;height:16px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 0 10px ${c},0 0 20px ${c}66"></div>
        </div>`,
        iconSize: [16, 16], iconAnchor: [8, 8],
      });
    };
    (points || []).forEach(p => {
      L.marker([p.lat, p.lng], { icon: markerIcon(p.kind) }).addTo(map).bindPopup(`<b>${escapeHtml(p.name)}</b>`);
    });

    const readout = document.getElementById("coordReadout");
    const zoomHint = document.getElementById("zoomHint");
    const hudAccuracy = document.getElementById("hudAccuracy");
    function updateReadout() {
      const c = map.getCenter();
      readout.textContent = `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;
      const z = map.getZoom();
      zoomHint.textContent = z >= 18 ? "🎯 دقة ممتازة" : z >= 15 ? "دقة جيدة — زوّم أكتر لأفضل نتيجة" : "⚠️ زوّم أكتر عشان الدقة";
      const accPct = Math.max(20, Math.min(99, Math.round((z / 20) * 100)));
      if (hudAccuracy) { hudAccuracy.innerHTML = `🎯 <span style="color:#fff">${accPct}%</span>`; hudAccuracy.style.color = accPct >= 85 ? "#4ADE80" : accPct >= 60 ? "#2DD4BF" : "#F5A623"; }
    }
    map.on("move", updateReadout);
    map.on("zoom", updateReadout);
    updateReadout();

    document.getElementById("satToggleBtn").onclick = () => {
      satOn = !satOn;
      if (satOn) { map.removeLayer(streetLayer); satLayer.addTo(map); }
      else { map.removeLayer(satLayer); streetLayer.addTo(map); }
    };

    // ---- أزرار الضبط الدقيق: تحريك مركز الخريطة بمقدار متر واحد بكل اتجاه ----
    document.querySelectorAll(".nudgeBtn").forEach(btn => {
      btn.onclick = () => {
        const c = map.getCenter();
        const dir = btn.getAttribute("data-nudge");
        const dLat = 1 / 111320; // متر واحد تقريبًا بخط العرض
        const dLng = 1 / (111320 * Math.cos(c.lat * Math.PI / 180));
        const moves = { up: [dLat, 0], down: [-dLat, 0], left: [0, -dLng], right: [0, dLng] };
        const [mLat, mLng] = moves[dir] || [0, 0];
        map.panTo([c.lat + mLat, c.lng + mLng], { animate: false });
        haptic(15);
      };
    });

    let accuracyCircle = null;
    document.getElementById("useMyLocBtnR").onclick = () => {
      if (!navigator.geolocation) { showToast("جهازك ما بيدعم تحديد الموقع", "err"); return; }
      showToast("...جارِ تحديد موقعك بأعلى دقة ممكنة", "info");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          map.setView([latitude, longitude], 19);
          if (accuracyCircle) map.removeLayer(accuracyCircle);
          accuracyCircle = L.circle([latitude, longitude], { radius: accuracy, color: "#2DD4BF", weight: 1, fillOpacity: .08 }).addTo(map);
          showToast(`تم تحديد موقعك (دقة ~${Math.round(accuracy)} م)`, accuracy <= 15 ? "ok" : "info");
        },
        () => showToast("ما قدرنا نحدد موقعك، تأكد من صلاحية الموقع", "err"),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    };

    const pointsSearchInput = document.getElementById("pointsSearchInput");
    if (pointsSearchInput) pointsSearchInput.addEventListener("input", () => {
      const q = pointsSearchInput.value.trim().toLowerCase();
      document.querySelectorAll("#pointsList [data-delpoint]").forEach(btn => {
        const row = btn.closest("div[style*='justify-content:space-between']");
        if (!row) return;
        row.style.display = row.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    });

    document.getElementById("savePointBtn").onclick = async () => {
      const name = document.getElementById("newPointName").value.trim();
      const kind = document.getElementById("newPointKind").value;
      const c = map.getCenter();
      if (!name) { showToast("لازم تكتب اسم للنقطة", "err"); return; }
      if (map.getZoom() < 14) { showToast("زوّم أكتر عالخريطة قبل ما تحفظ، للدقة", "err"); return; }
      const btn = document.getElementById("savePointBtn");
      btn.disabled = true; btn.textContent = "...جارِ الحفظ";
      const { error: insErr } = await sb.from("route_points").insert({ name, kind, lat: c.lat, lng: c.lng });
      if (insErr) { showToast("صار خطأ بالحفظ، جرب كمان", "err"); btn.disabled = false; btn.textContent = "📌 ثبّت هاي النقطة واحفظها"; return; }
      await logAudit("إضافة نقطة مسار", `${name} (${kind === "internal" ? "داخلي" : "خارجي"})`);
      haptic();
      showToast("انحفظت النقطة", "ok");
      renderRoutesTab();
    };

    document.querySelectorAll("[data-delpoint]").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("متأكد إنك بدك تحذف هاي النقطة؟")) return;
        const id = btn.getAttribute("data-delpoint");
        await sb.from("route_points").delete().eq("id", id);
        await logAudit("حذف نقطة مسار", id);
        renderRoutesTab();
      };
    });

    if (!edgesReady) return;

    // ---- ارسم الروابط الموجودة كخطوط على الخريطة (تتبع الطريق الحقيقي لو محفوظ) ----
    let routeHighlight = null;
    edgeList.forEach(e => {
      const a = pointById[e.point_a], b = pointById[e.point_b];
      if (!a || !b) return;
      const coords = (e.geometry && e.geometry.length > 1) ? e.geometry : [[a.lat, a.lng], [b.lat, b.lng]];
      L.polyline(coords, { color: "#5B6779", weight: 3, opacity: .6, dashArray: e.geometry ? null : "5,6" }).addTo(map);
    });

    const refreshEdgesBtn = document.getElementById("refreshEdgesBtn");
    if (refreshEdgesBtn) refreshEdgesBtn.onclick = async () => {
      const statusEl = document.getElementById("edgeRefreshStatus");
      const toFix = edgeList.filter(e => !e.geometry);
      refreshEdgesBtn.disabled = true;
      for (let i = 0; i < toFix.length; i++) {
        const e = toFix[i];
        const a = pointById[e.point_a], b = pointById[e.point_b];
        if (!a || !b) continue;
        statusEl.textContent = `...جارِ التحديث (${i + 1}/${toFix.length})`;
        const route = await fetchRoadRoute(a, b);
        await sb.from("route_edges").update({ distance_m: route.distance_m, geometry: route.geometry }).eq("id", e.id);
      }
      statusEl.textContent = "✅ خلص التحديث";
      showToast("تحدّثت الروابط للطريق الحقيقي", "ok");
      renderRoutesTab();
    };

    document.getElementById("addEdgeBtn").onclick = async () => {
      const fromId = document.getElementById("edgeFromSel").value;
      const toId = document.getElementById("edgeToSel").value;
      if (!fromId || !toId || fromId === toId) { showToast("اختار نقطتين مختلفتين", "err"); return; }
      const a = pointById[fromId], b = pointById[toId];
      const btn = document.getElementById("addEdgeBtn");
      btn.disabled = true; btn.textContent = "...جارِ حساب الطريق الحقيقي";
      const route = await fetchRoadRoute(a, b);
      const { error: insErr } = await sb.from("route_edges").insert({ point_a: fromId, point_b: toId, distance_m: route.distance_m, geometry: route.geometry });
      if (insErr) { showToast("صار خطأ، جرب كمان", "err"); btn.disabled = false; btn.textContent = "🔗 اربط النقطتين"; return; }
      await logAudit("ربط نقطتي مسار", `${a.name} ↔ ${b.name} (${Math.round(route.distance_m)}م${route.real ? " — طريق حقيقي" : " — تقريبي"})`);
      haptic();
      showToast(route.real ? "انربطت النقطتين عبر الطريق الفعلي ✅" : "انربطت (تعذّر الوصول لمحرك الطرق، استُخدم خط تقريبي)", route.real ? "ok" : "info");
      renderRoutesTab();
    };

    document.querySelectorAll("[data-deledge]").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("متأكد إنك بدك تحذف هاد الرابط؟")) return;
        await sb.from("route_edges").delete().eq("id", btn.getAttribute("data-deledge"));
        renderRoutesTab();
      };
    });

    // ---- دايكسترا لحساب أقصر مسار عبر شبكة النقاط والروابط ----
    function shortestPath(startId, endId) {
      const graph = {};
      (points || []).forEach(p => { graph[p.id] = []; });
      edgeList.forEach(e => {
        if (!graph[e.point_a] || !graph[e.point_b]) return;
        graph[e.point_a].push({ to: e.point_b, dist: e.distance_m });
        graph[e.point_b].push({ to: e.point_a, dist: e.distance_m });
      });
      const dist = {}, prev = {}, visited = new Set();
      Object.keys(graph).forEach(id => { dist[id] = Infinity; });
      dist[startId] = 0;
      const queue = new Set(Object.keys(graph));
      while (queue.size) {
        let u = null, best = Infinity;
        queue.forEach(id => { if (dist[id] < best) { best = dist[id]; u = id; } });
        if (u === null) break;
        queue.delete(u); visited.add(u);
        if (u === endId) break;
        (graph[u] || []).forEach(edge => {
          if (visited.has(edge.to)) return;
          const alt = dist[u] + edge.dist;
          if (alt < dist[edge.to]) { dist[edge.to] = alt; prev[edge.to] = u; }
        });
      }
      if (dist[endId] === Infinity) return null;
      const path = [endId];
      let cur = endId;
      while (prev[cur]) { cur = prev[cur]; path.unshift(cur); }
      return { path, distance: dist[endId] };
    }

    let routeMarkers = [];
    function fullRouteCoords(path) {
      let full = [];
      for (let i = 0; i < path.length - 1; i++) {
        const aId = path[i], bId = path[i + 1];
        const edge = edgeList.find(e => (e.point_a === aId && e.point_b === bId) || (e.point_a === bId && e.point_b === aId));
        let seg;
        if (edge && edge.geometry && edge.geometry.length > 1) {
          seg = edge.point_a === aId ? edge.geometry.slice() : edge.geometry.slice().reverse();
        } else {
          seg = [[pointById[aId].lat, pointById[aId].lng], [pointById[bId].lat, pointById[bId].lng]];
        }
        if (full.length > 0) seg = seg.slice(1);
        full = full.concat(seg);
      }
      return full;
    }

    document.getElementById("calcRouteBtn").onclick = () => {
      const fromId = document.getElementById("routeFromSel").value;
      const toId = document.getElementById("routeToSel").value;
      const resultBox = document.getElementById("routeResult");
      if (!fromId || !toId || fromId === toId) { showToast("اختار نقطة انطلاق ووجهة مختلفتين", "err"); return; }
      const result = shortestPath(fromId, toId);
      if (routeHighlight) { map.removeLayer(routeHighlight); routeHighlight = null; }
      routeMarkers.forEach(m => map.removeLayer(m)); routeMarkers = [];
      if (!result) {
        resultBox.innerHTML = `<div style="color:#D64545;font-size:12.5px">🚫 ما في مسار مربوط بين هاي النقطتين. لازم تربط النقاط بالطريق بينهم أول (بقسم الربط فوق).</div>`;
        return;
      }
      const coords = fullRouteCoords(result.path);

      // علامتي البداية والنهاية بشكل مميز (علم أخضر للانطلاق، هدف أحمر للوجهة)
      const startIcon = L.divIcon({ className:"", html:`<div style="font-size:26px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))">🏁</div>`, iconSize:[26,26], iconAnchor:[13,26] });
      const endIcon = L.divIcon({ className:"", html:`<div style="font-size:26px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))">🎯</div>`, iconSize:[26,26], iconAnchor:[13,26] });
      routeMarkers.push(L.marker(coords[0], { icon: startIcon, zIndexOffset: 1000 }).addTo(map));
      routeMarkers.push(L.marker(coords[coords.length-1], { icon: endIcon, zIndexOffset: 1000 }).addTo(map));

      // رسم متحرك للمسار (نقطة نقطة) بدل ظهوره فجأة — بتأثير توهج نيون (طبقة ضبابية + خط حاد)
      const glowLine = L.polyline([], { color: "#2DD4BF", weight: 14, opacity: .25, className: "routeGlowLine" }).addTo(map);
      routeHighlight = L.polyline([], { color: "#8FFFF0", weight: 4, opacity: 1 }).addTo(map);
      routeMarkers.push(glowLine);
      map.fitBounds(L.polyline(coords).getBounds(), { padding: [40, 40] });
      let i = 0;
      const drawStep = () => {
        if (i >= coords.length) return;
        routeHighlight.addLatLng(coords[i]);
        glowLine.addLatLng(coords[i]);
        i++;
        setTimeout(drawStep, 90);
      };
      drawStep();

      const km = (result.distance / 1000).toFixed(2);
      const walkMin = Math.round(result.distance / 80); // ~80 م/دقيقة مشي
      const driveMin = Math.max(1, Math.round(result.distance / 1000 / 30 * 60)); // ~30 كم/سا داخل قاعدة/طرق ضيقة

      const legsHtml = result.path.slice(0, -1).map((id, idx) => {
        const a = pointById[id], b = pointById[result.path[idx+1]];
        const legDist = Math.round(haversine(a, b));
        return `<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#8A97A8;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06)">
          <span>${escapeHtml(a.name)} → ${escapeHtml(b.name)}</span><span style="font-family:monospace;color:#B9C3D1">${legDist} م</span>
        </div>`;
      }).join("");

      resultBox.innerHTML = `
        <div style="background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);border-radius:10px;padding:14px">
          <div style="font-weight:900;font-size:16px;color:#2DD4BF;margin-bottom:2px">${km} كم</div>
          <div style="font-size:11.5px;color:#8A97A8;margin-bottom:10px">🚶 ~${walkMin} د مشي &nbsp;|&nbsp; 🚗 ~${driveMin} د قيادة</div>
          <div style="font-size:12px;color:#B9C3D1;font-weight:700;margin-bottom:8px">🏁 ${result.path.map(id => escapeHtml(pointById[id].name)).join(" ← ")} 🎯</div>
          <div style="font-weight:700;font-size:11.5px;color:#8A97A8;margin-bottom:4px">تفصيل المراحل (${result.path.length - 1}):</div>
          ${legsHtml}
        </div>`;
      haptic();
    };
  }

  async function renderOpsCenterTab() {
    const main = document.getElementById("main");
    main.innerHTML = `<div class="skeletonWrap"><div class="skelCard"></div><div class="skelCard" style="height:160px"></div><div class="skelCard"></div></div>`;

    const today = todayISO();
    const heatStart = addDays(today, -83); // 12 أسبوع = 84 يوم
    const [{ data: logs }, { data: reqs }, { data: viols }, heatRecords, todayRecords] = await Promise.all([
      sb.from("audit_log").select("*").order("created_at", { ascending: false }).limit(15),
      sb.from("requests").select("*").order("created_at", { ascending: false }).limit(10),
      sb.from("violations").select("*").order("created_at", { ascending: false }).limit(10),
      loadAttendanceRange(heatStart, today),
      loadAttendance(today),
    ]);
    if (currentTab !== "opscenter") return;

    // ---- 1) التايم لاين الحي الموحّد ----
    const feedItems = [
      ...(logs || []).map(l => ({ t: l.created_at, icon: "🕵️", text: `${l.action}${l.details ? " — " + l.details : ""}`, color: "#8A97A8" })),
      ...(reqs || []).map(r => ({ t: r.created_at, icon: "📨", text: `طلب ${STATUS[r.type]?.label || r.type} جديد`, color: "#3B82C4" })),
      ...(viols || []).map(v => ({ t: v.created_at, icon: "⚠️", text: `مخالفة: ${v.description || v.type || ""}`, color: "#D64545" })),
    ].filter(x => x.t).sort((a, b) => new Date(b.t) - new Date(a.t)).slice(0, 20);

    const timeAgo = (iso) => {
      const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (diffMin < 1) return "توّه";
      if (diffMin < 60) return `قبل ${diffMin} د`;
      const h = Math.round(diffMin / 60);
      if (h < 24) return `قبل ${h} س`;
      return `قبل ${Math.round(h / 24)} يوم`;
    };

    // ---- 2) الخريطة الحرارية للحضور (١٢ أسبوع) ----
    const byDate = {};
    (heatRecords || []).forEach(r => { (byDate[r.date] ||= []).push(r); });
    const totalM = MEMBERS.length || 1;
    const heatDays = Array.from({ length: 84 }, (_, i) => addDays(heatStart, i));
    const heatCells = heatDays.map(d => {
      const present = (byDate[d] || []).filter(r => r.status === "present").length;
      const pct = Math.round((present / totalM) * 100);
      const alpha = pct === 0 ? 0.06 : Math.min(1, 0.15 + pct / 100 * 0.85);
      return `<div title="${d} — ${pct}%" style="width:11px;height:11px;border-radius:3px;background:rgba(45,212,191,${alpha})"></div>`;
    }).join("");

    // ---- 3) لوحة ترتيب الوحدات (آخر ٤ أسابيع) ----
    const rankStart = addDays(today, -27);
    const rankRecords = (heatRecords || []).filter(r => r.date >= rankStart);
    const rankByDate = {};
    rankRecords.forEach(r => { (rankByDate[r.date] ||= {})[r.member_id] = r.status; });
    const rankDays = Array.from({ length: 28 }, (_, i) => addDays(rankStart, i));
    const unitScores = UNITS.map(u => {
      const uMembers = MEMBERS.filter(m => m.unit_id === u.id);
      if (uMembers.length === 0) return { name: u.name, pct: 0 };
      let presentSlots = 0;
      rankDays.forEach(d => { uMembers.forEach(m => { if ((rankByDate[d] || {})[m.id] === "present") presentSlots++; }); });
      return { name: u.name, pct: Math.round((presentSlots / (uMembers.length * 28)) * 100) };

  const VIOLATION_STATUS_LABEL = { active: "سارية", resolved: "✔ مُغلَقة" };

  async function renderViolationsTab() {
    const main = document.getElementById("main");
    let selectedMemberId = null;

    const { data: allViolations } = await sb.from("violations").select("*").order("created_at", { ascending: false });

    const rowsHtml = (allViolations || []).map(v => {
      const m = MEMBERS.find(mm => mm.id === v.member_id);
      const badgeColor = v.status === "resolved" ? "#2FAE60" : "#D64545";
      return `
        <div class="formCard" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-weight:800">${escapeHtml(m?.name || "فرد محذوف")}</div>
            <div style="font-size:11px;font-weight:800;color:${badgeColor}">${VIOLATION_STATUS_LABEL[v.status] || v.status}</div>
          </div>
          <div style="font-size:12px;color:#C7D0DC;margin-bottom:4px">📅 ${v.date || ""}${v.recorded_by ? ` — سجّلها: ${escapeHtml(v.recorded_by)}` : ""}</div>
          <div style="font-size:13px;margin-bottom:4px"><b>الوصف:</b> ${escapeHtml(v.description || "")}</div>
          ${v.penalty ? `<div style="font-size:13px;margin-bottom:8px"><b>العقوبة:</b> ${escapeHtml(v.penalty)}</div>` : ""}
          <div style="display:flex;gap:8px">
            ${v.status !== "resolved" ? `<button class="approveBtn" data-resolveviolation="${v.id}">✔ إغلاق المخالفة</button>` : `<button class="ghost" data-reopenviolation="${v.id}">↩️ إعادة فتحها</button>`}
            <button class="rejectBtn" data-delviolation="${v.id}">🗑️ حذف</button>
          </div>
        </div>`;
    }).join("") || `<div style="font-size:12px;color:#8A97A8;text-align:center;padding:14px">ما في مخالفات مسجّلة</div>`;

    const openCount = (allViolations || []).filter(v => v.status !== "resolved").length;
    const resolvedCount = (allViolations || []).filter(v => v.status === "resolved").length;

    main.innerHTML = `
      <div class="statBadgeRow">
        ${statBadge(openCount, "مخالفة مفتوحة", "#D64545", "⚠️")}
        ${statBadge(resolvedCount, "تم إغلاقها", "#2FAE60", "✔️")}
      </div>
      <div class="formCard">
        <div style="font-weight:800;margin-bottom:8px">⚠️ تسجيل مخالفة جديدة</div>
        <input type="text" id="violMemberSearch" placeholder="اكتبي اسم الفرد..." style="margin-bottom:6px" />
        <div id="violMemberResults" style="margin-bottom:8px"></div>
        <div id="violSelectedMember" style="font-size:12px;color:#2DD4BF;margin-bottom:8px;display:none"></div>
        <textarea id="violDescription" rows="2" placeholder="وصف المخالفة..." style="width:100%;margin-bottom:8px"></textarea>
        <textarea id="violPenalty" rows="2" placeholder="العقوبة (اختياري)..." style="width:100%;margin-bottom:8px"></textarea>
        <button id="violSubmitBtn" style="width:100%">تسجيل المخالفة</button>
        <div id="violStatus" style="font-size:12px;margin-top:8px"></div>
      </div>

      <div style="font-weight:800;margin:16px 0 10px">📋 كل المخالفات (${(allViolations || []).length})</div>
      ${rowsHtml}
    `;

    const searchInput = document.getElementById("violMemberSearch");
    const resultsBox = document.getElementById("violMemberResults");
    const selectedBox = document.getElementById("violSelectedMember");
    searchInput.oninput = () => {
      const q = searchInput.value.trim();
      if (!q) { resultsBox.innerHTML = ""; return; }
      const matches = MEMBERS.filter(m => m.name.includes(q)).slice(0, 10);
      resultsBox.innerHTML = matches.map(m => `<div class="smallMember" data-pickviolmember="${m.id}" style="cursor:pointer"><span>${escapeHtml(m.name)}</span></div>`).join("") || `<div style="font-size:12px;color:#8A97A8">ما في نتائج</div>`;
      resultsBox.querySelectorAll("[data-pickviolmember]").forEach(row => row.addEventListener("click", () => {
        selectedMemberId = row.getAttribute("data-pickviolmember");
        const m = MEMBERS.find(mm => mm.id === selectedMemberId);
        selectedBox.style.display = "block";
        selectedBox.textContent = `✔ الفرد المحدد: ${m?.name || ""}`;
        resultsBox.innerHTML = "";
        searchInput.value = "";
      }));
    };

    document.getElementById("violSubmitBtn").onclick = async () => {
      const statusEl = document.getElementById("violStatus");
      const desc = document.getElementById("violDescription").value.trim();
      if (!selectedMemberId) { statusEl.style.color = "#D64545"; statusEl.textContent = "لازم تختاري الفرد أول."; return; }
      if (!desc) { statusEl.style.color = "#D64545"; statusEl.textContent = "لازم تكتبي وصف المخالفة."; return; }
      const penalty = document.getElementById("violPenalty").value.trim();
      const btn = document.getElementById("violSubmitBtn");
      btn.disabled = true; btn.textContent = "...جارِ التسجيل";
      try {
        const { error } = await sb.from("violations").insert({ member_id: selectedMemberId, description: desc, penalty: penalty || null, status: "active", recorded_by: "المسؤول" });
        if (error) throw error;
        renderViolationsTab();
      } catch (e) {
        statusEl.style.color = "#D64545";
        statusEl.textContent = "صار خطأ أثناء التسجيل: " + (e && (e.message || e.details || e.hint) || String(e));
        btn.disabled = false; btn.textContent = "تسجيل المخالفة";
      }
    };

    main.querySelectorAll("[data-resolveviolation]").forEach(b => b.addEventListener("click", async () => {
      const { error } = await sb.from("violations").update({ status: "resolved" }).eq("id", b.getAttribute("data-resolveviolation"));
      if (error) { alert("صار خطأ: " + error.message); return; }
      renderViolationsTab();
    }));
    main.querySelectorAll("[data-reopenviolation]").forEach(b => b.addEventListener("click", async () => {
      const { error } = await sb.from("violations").update({ status: "active" }).eq("id", b.getAttribute("data-reopenviolation"));
      if (error) { alert("صار خطأ: " + error.message); return; }
      renderViolationsTab();
    }));
    main.querySelectorAll("[data-delviolation]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("متأكد بدك تحذف هاي المخالفة نهائيًا؟")) return;
      const { error } = await sb.from("violations").delete().eq("id", b.getAttribute("data-delviolation"));
      if (error) { alert("صار خطأ: " + error.message); return; }
      renderViolationsTab();
    }));
  }

  async function exportFullBackupExcel() {
    const memberName = (id) => MEMBERS.find(m => m.id === id)?.name || "—";
    const wb = XLSX.utils.book_new();

    // 1. الأفراد
    const membersRows = MEMBERS.map(m => {
      const unit = UNITS.find(u => u.id === m.unit_id);
      const squad = SQUADS.find(s => s.id === m.squad_id);
      const platoon = squad ? PLATOONS.find(p => p.id === squad.platoon_id) : null;
      return {
        "الاسم": m.name,
        "السرية": unit?.name || "",
        "الفصيلة": platoon?.name || "—",
        "المجموعة": squad?.name || "—",
        "الرمز السري": m.pin,
        "تاريخ الإضافة": m.created_at ? String(m.created_at).slice(0,10) : "",
      };
    });
    const wsMembers = XLSX.utils.json_to_sheet(membersRows.length ? membersRows : [{"الاسم":""}]);
    wsMembers["!cols"] = [{wch:20},{wch:14},{wch:14},{wch:14},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb, wsMembers, "الأفراد");

    // 2. الحضور (كل السجلات)
    const { data: allAttendance } = await sb.from("attendance").select("*").order("date", { ascending:false });
    const attRows = (allAttendance || []).map(r => ({
      "الاسم": memberName(r.member_id),
      "التاريخ": r.date,
      "الحالة": STATUS[r.status]?.label || r.status || "",
      "وقت الدخول": r.time_in || "",
      "ضمن نطاق القاعدة": r.geo?.in_range === true ? "نعم" : (r.geo?.in_range === false ? "لا" : "—"),
      "المسافة عن القاعدة (م)": r.geo?.distance_m != null ? Math.round(r.geo.distance_m) : "",
      "آخر تحديث": fmtDT(r.updated_at),
    }));
    const wsAtt = XLSX.utils.json_to_sheet(attRows.length ? attRows : [{"الاسم":""}]);
    wsAtt["!cols"] = [{wch:20},{wch:12},{wch:10},{wch:10},{wch:14},{wch:16},{wch:18}];
    XLSX.utils.book_append_sheet(wb, wsAtt, "الحضور");

    // 3. الطلبات (عذر/مرض/سفر/إجازة)
    const { data: allRequests } = await sb.from("requests").select("*").order("created_at", { ascending:false });
    const reqRows = (allRequests || []).map(r => ({
      "الاسم": memberName(r.member_id),
      "النوع": STATUS[r.type]?.label || r.type || "",
      "التاريخ": r.date,
      "ملاحظة": r.note || "",
      "الحالة": REQ_STATUS_LABELS_BACKUP[r.status] || r.status || "",
      "تاريخ الإرسال": fmtDT(r.created_at),
      "تاريخ القرار": fmtDT(r.decided_at),
    }));
    const wsReq = XLSX.utils.json_to_sheet(reqRows.length ? reqRows : [{"الاسم":""}]);
    wsReq["!cols"] = [{wch:20},{wch:10},{wch:12},{wch:24},{wch:16},{wch:18},{wch:18}];
    XLSX.utils.book_append_sheet(wb, wsReq, "الطلبات");

    // 4. طلبات التبديل
    const { data: allSwaps } = await sb.from("swap_requests").select("*").order("created_at", { ascending:false });
    const swapRows = (allSwaps || []).map(sr => ({
      "مقدّم الطلب": memberName(sr.requester_id),
      "الطرف الثاني": memberName(sr.partner_id),
      "تاريخ التبديل": sr.swap_date,
      "ملاحظة": sr.note || "",
      "الحالة": REQ_STATUS_LABELS_BACKUP[sr.status] || sr.status || "",
      "تاريخ الإرسال": fmtDT(sr.created_at),
      "تاريخ القرار": fmtDT(sr.decided_at),
    }));
    const wsSwap = XLSX.utils.json_to_sheet(swapRows.length ? swapRows : [{"مقدّم الطلب":""}]);
    wsSwap["!cols"] = [{wch:20},{wch:20},{wch:12},{wch:24},{wch:16},{wch:18},{wch:18}];
    XLSX.utils.book_append_sheet(wb, wsSwap, "طلبات التبديل");

    // 5. المخالفات (قد يكون الجدول فاضي أو غير مستخدم بعد)
    let violationRows = [];
    try {
      const { data: allViolations } = await sb.from("violations").select("*").order("date", { ascending:false });
      violationRows = (allViolations || []).map(v => ({
        "الاسم": memberName(v.member_id),
        "التاريخ": v.date,
        "الوصف": v.description || "",
        "العقوبة": v.penalty || "",
        "الحالة": v.status || "",
        "تاريخ التسجيل": fmtDT(v.created_at),
      }));

      if (unitPlatoons.length === 0) {
        structRows.push({ "السرية": u.name, "الفصيلة": "—", "قائد الفصيلة": "—", "المجموعة": "—", "قائد المجموعة": "—", "عدد الأفراد": MEMBERS.filter(m=>m.unit_id===u.id).length });
      }
      unitPlatoons.forEach(p => {
        const platoonSquads = SQUADS.filter(s => s.platoon_id === p.id);
        const platoonCmd = memberName(p.commander_member_id);
        if (platoonSquads.length === 0) {
          structRows.push({ "السرية": u.name, "الفصيلة": p.name, "قائد الفصيلة": p.commander_member_id ? platoonCmd : "—", "المجموعة": "—", "قائد المجموعة": "—", "عدد الأفراد": 0 });
        }
        platoonSquads.forEach(s => {
          const squadMembers = MEMBERS.filter(m => m.squad_id === s.id);
          structRows.push({
            "السرية": u.name, "الفصيلة": p.name,
            "قائد الفصيلة": p.commander_member_id ? platoonCmd : "—",
            "المجموعة": s.name,
            "قائد المجموعة": s.commander_member_id ? memberName(s.commander_member_id) : "—",
            "عدد الأفراد": squadMembers.length,
          });
        });
      });
    });
    const wsStruct = XLSX.utils.json_to_sheet(structRows.length ? structRows : [{"السرية":""}]);
    wsStruct["!cols"] = [{wch:16},{wch:16},{wch:18},{wch:16},{wch:18},{wch:12}];
    XLSX.utils.book_append_sheet(wb, wsStruct, "الهيكل التنظيمي");

    // 7. الإعدادات
    const settingsRows = [
      { "الإعداد": "دورة المناوبة (rotation)", "القيمة": ROTATION ? JSON.stringify(ROTATION) : "" },
      { "الإعداد": "موقع القاعدة (base_location)", "القيمة": BASE_LOCATION ? JSON.stringify(BASE_LOCATION) : "" },
    ];
    const wsSettings = XLSX.utils.json_to_sheet(settingsRows);
    wsSettings["!cols"] = [{wch:26},{wch:50}];
    XLSX.utils.book_append_sheet(wb, wsSettings, "الإعدادات");

    const stamp = todayISO();
    XLSX.writeFile(wb, `نسخة-احتياطية-كاملة-${stamp}.xlsx`);
  }

  async function printTodayDutyRoster() {
    const dateISO = todayISO();
    const records = await loadAttendance(dateISO);
    const recByMember = {};
    records.forEach(r => recByMember[r.member_id] = r);
    const onDutyUnitId = getOnDutyUnitId(UNITS, ROTATION, dateISO);
    const onDutyUnit = UNITS.find(u => u.id === onDutyUnitId) || UNITS[0];
    const weekStart = getWeekStart(dateISO, ROTATION);
    const planRows = await loadShiftPlan(weekStart);
    const onDutyPlatoons = PLATOONS.filter(p => p.unit_id === onDutyUnitId);

    function membersOfPlatoon(platoonId) {
      const squadIds = SQUADS.filter(s => s.platoon_id === platoonId).map(s => s.id);
      return MEMBERS.filter(m => squadIds.includes(m.squad_id));
    }

    const shiftSections = SHIFTS.map(shift => {
      const platoonIds = planRows.filter(r => r.shift === shift.id && onDutyPlatoons.some(p => p.id === r.platoon_id)).map(r => r.platoon_id);
      const platoonNames = platoonIds.map(pid => onDutyPlatoons.find(p => p.id === pid)?.name).filter(Boolean);
      const mems = platoonIds.flatMap(pid => membersOfPlatoon(pid));
      return { shift, platoonNames, members: mems };
    });

    const coveredIds = new Set(shiftSections.flatMap(s => s.members.map(m => m.id)));
    const allUnitMembers = MEMBERS.filter(m => m.unit_id === onDutyUnitId);
    const leftover = allUnitMembers.filter(m => !coveredIds.has(m.id));

    const rowsHtml = (mems) => mems.length === 0
      ? `<tr><td colspan="5" style="text-align:center;color:#888;padding:10px">لا يوجد أفراد</td></tr>`
      : mems.map((m, i) => {
          const rec = recByMember[m.id];
          const squad = SQUADS.find(s => s.id === m.squad_id);
          const statusLabel = rec ? (STATUS[rec.status]?.label || rec.status) : "لم يُحدد بعد";
          return `<tr>
            <td>${i + 1}</td>
            <td>${escapeHtml(m.name)}</td>
            <td>${escapeHtml(squad?.name || "—")}</td>
            <td>${escapeHtml(statusLabel)}</td>
            <td>${escapeHtml(rec?.time_in || "—")}</td>
          </tr>`;
        }).join("");

    const sectionsHtml = shiftSections.map(sec => `
      <div class="section">
        <div class="secHead">
          <span>${escapeHtml(sec.shift.label)} (${escapeHtml(sec.shift.range)})</span>
          <span class="secPlatoons">${sec.platoonNames.length ? "الفصيلة: " + sec.platoonNames.map(escapeHtml).join("، ") : "بدون فصيلة معيّنة"}</span>
        </div>
        <table>
          <thead><tr><th>#</th><th>الاسم</th><th>المجموعة</th><th>الحالة</th><th>وقت الدخول</th></tr></thead>
          <tbody>${rowsHtml(sec.members)}</tbody>
        </table>
      </div>
    `).join("");

    const leftoverHtml = leftover.length ? `
      <div class="section">
        <div class="secHead"><span>أفراد غير مغطّين بأي نوبة اليوم</span></div>
        <table>
          <thead><tr><th>#</th><th>الاسم</th></tr></thead>
          <tbody>${leftover.map((m, i) => `<tr><td>${i + 1}</td><td>${escapeHtml(m.name)}</td></tr>`).join("")}</tbody>
        </table>
      </div>` : "";

    const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
      <title>دوام اليوم — ${dateISO}</title>
      <style>
        body { font-family: Tahoma, Arial, sans-serif; padding: 24px; color:#111; }
        h1 { font-size:20px; margin:0 0 2px; }
        .sub { color:#555; font-size:13px; margin-bottom:18px; }
        .section { margin-bottom:22px; page-break-inside: avoid; }
        .secHead { display:flex; justify-content:space-between; font-weight:bold; font-size:14px; border-bottom:2px solid #333; padding-bottom:6px; margin-bottom:6px; }
        .secPlatoons { font-weight:normal; font-size:12px; color:#555; }
        table { width:100%; border-collapse:collapse; font-size:12.5px; }
        th, td { border:1px solid #ccc; padding:6px 8px; text-align:right; }
        th { background:#eee; }
        .footer { margin-top:30px; font-size:11px; color:#777; text-align:center; }
        @media print { body { padding:8px; } }
      </style></head>
      <body>
        <h1>سجلّ الدوام — دوام اليوم</h1>
        <div class="sub">${escapeHtml(dayNameAr(dateISO))} — ${escapeHtml(monthNameAr(dateISO))} &nbsp;|&nbsp; السرية المناوبة: ${escapeHtml(onDutyUnit?.name || "")}</div>
        ${sectionsHtml}
        ${leftoverHtml}
        <div class="footer">تم توليد هذا التقرير آليًا من نظام سجلّ الدوام</div>
      </body></html>`;

    const w = window.open("", "_blank");
    if (!w) { alert("الرجاء السماح بفتح نافذة منبثقة (Pop-up) لطباعة التقرير"); return; }
    w.document.write(html);
    w.document.close();
    w.onload = () => { w.focus(); w.print(); };

      sendEmergencyBtn.disabled = true; sendEmergencyBtn.textContent = "...جارِ الإرسال";

        });
      } catch (e) {
        statusEl.style.color = "#D64545";
        statusEl.textContent = "صار خطأ أثناء الإرسال، جرب مرة ثانية.";
        sendEmergencyBtn.disabled = false; sendEmergencyBtn.textContent = "🚨 إرسال الآن لكل المناوبين";

    };

    const clearEmergencyBtn = document.getElementById("clearEmergencyBtn");

    };

    // Chart 4: monthly trend — avg attendance % per week for the last 8 weeks
    const monthlyByDateMember = {};
    monthlyRecords.forEach(r => { (monthlyByDateMember[r.date] ||= {})[r.member_id] = r.status; });

    const monthlyData = weekStarts.map(ws => {

      let presentSlots = 0;
      wDays.forEach(d => {
        const dayMap = monthlyByDateMember[d] || {};

      });
      return totalMembers ? Math.round((presentSlots / (totalMembers * 7)) * 100) : 0;

    // Chart 5: top 5 members by absence count this week
    const absenceCounts = MEMBERS.map(m => {
      let count = 0;
      days.forEach(d => { if ((byDateMember[d] || {})[m.id] === "absent") count++; });
      return { name: m.name, count };

    // Executive summary: KPI deltas vs previous week

          <div style="font-weight:800;font-size:14px;margin-bottom:8px">🩺 الحالة العامة للوحدة</div>
          <div style="font-size:12px;color:#8A97A8;line-height:1.8">
            مؤشر مركّب من نسبة الحضور المتوسطة لهالأسبوع. ${healthPct >= 70 ? 'الأداء العام ضمن المستوى المقبول.' : 'الأداء العام بحاجة لمتابعة ومراجعة أسباب الغياب.'}
          </div>
        </div>
      </div>

      <div class="formCard">
        <div style="font-weight:800;font-size:14px;margin-bottom:10px">🚨 تنبيهات المخاطر</div>
        ${risks.map(r => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <div style="font-size:12.5px;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:${r.color};box-shadow:0 0 8px ${r.color};flex-shrink:0"></span>${r.label}</div>
            <div style="font-size:11px;font-weight:800;color:${r.color}">${r.level} ${r.level === 'منخفض' ? '🟢' : r.level === 'متوسط' ? '🟠' : '🔴'}</div>

    document.getElementById("advChartsWrap").insertAdjacentHTML("afterbegin", execHtml);

    destroyAdvCharts();
