  // ---------- Duty ----------
  async function loadAttendance(dateISO) {
    const { data } = await sb.from("attendance").select("*").eq("date", dateISO);
    return data || [];
  }
  async function loadAttendanceRange(startISO, endISO) {
    const { data } = await sb.from("attendance").select("*").gte("date", startISO).lte("date", endISO);
    return data || [];
  }
  async function upsertAttendance(memberId, dateISO, patch) {
    const { data: existing } = await sb.from("attendance").select("*").eq("member_id", memberId).eq("date", dateISO).maybeSingle();
    if (existing) {
      await sb.from("attendance").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", existing.id);
    } else {
      await sb.from("attendance").insert({ member_id: memberId, date: dateISO, ...patch });
    }
  }

  async function renderDuty() {
    const main = document.getElementById("main");
    main.innerHTML = `<div class="skeletonWrap"><div class="skelCard"></div><div class="skelCard"></div><div class="skelCard"></div></div>`;
    const records = await loadAttendance(currentDate);
    const onDutyUnitId = getOnDutyUnitId(UNITS, ROTATION, currentDate);
    const onDutyUnit = UNITS.find(u => u.id === onDutyUnitId) || UNITS[0];
    const offDutyUnit = UNITS.find(u => u.id !== onDutyUnitId) || UNITS[1];
    const weekStart = getWeekStart(currentDate, ROTATION);
    const planRows = await loadShiftPlan(weekStart);
    const onDutyPlatoons = PLATOONS.filter(p => p.unit_id === onDutyUnitId);
    const recByMember = {};
    records.forEach(r => recByMember[r.member_id] = r);
    const now = new Date();
    const isToday = currentDate === todayISO();

    function membersOfPlatoon(platoonId) {
      const squadIds = SQUADS.filter(s => s.platoon_id === platoonId).map(s => s.id);
      return MEMBERS.filter(m => squadIds.includes(m.squad_id));
    }

    const coveredMemberIds = new Set();
    const shiftMembersMap = {};
    SHIFTS.forEach(shift => {
      const platoonIds = planRows.filter(r => r.shift === shift.id && onDutyPlatoons.some(p => p.id === r.platoon_id)).map(r => r.platoon_id);
      const mems = platoonIds.flatMap(pid => membersOfPlatoon(pid));
      shiftMembersMap[shift.id] = mems;
      mems.forEach(m => coveredMemberIds.add(m.id));
    });

    const allUnitMembers = MEMBERS.filter(m => m.unit_id === onDutyUnitId);
    const leftover = allUnitMembers.filter(m => !coveredMemberIds.has(m.id));

    const presentTodayCount = records.filter(r => r.status === "present").length;
    const absentTodayCount = records.filter(r => r.status === "absent").length;

    main.innerHTML = `
      <div class="dateBar">
        <button class="iconbtn" data-prevday>›</button>
        <div style="text-align:center">
          <div class="dateMain">${dayNameAr(currentDate)} — ${monthNameAr(currentDate)}</div>
          ${!isToday ? `<button class="linkbtn" data-today>العودة لليوم</button>` : ""}
        </div>
        <button class="iconbtn" data-nextday>‹</button>
      </div>
      <div class="statBadgeRow">
        ${statBadge(presentTodayCount, "حاضر", "#4ADE80", "✅")}
        ${statBadge(absentTodayCount, "غائب", "#D64545", "⛔")}
        ${statBadge(coveredMemberIds.size, "مغطّى بالخطة", "#2DD4BF", "🗓️")}
      </div>
      <div class="dutyBanner">
        <div><div class="dutyLabel">السرية المناوبة هذا الأسبوع</div><div class="dutyUnit">${escapeHtml(onDutyUnit?.name||"")}</div></div>
        <div style="text-align:left"><div style="font-size:12px;color:#8A97A8">مستريحة</div><div style="font-size:13px;color:#8A97A8">${escapeHtml(offDutyUnit?.name||"")}</div></div>
      </div>

      <div class="formCard" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-weight:800;font-size:13px">📍 موقع القاعدة</div>
          <div style="font-size:12px;color:#8A97A8">${BASE_LOCATION ? `نطاق القبول: ${BASE_LOCATION.radius} متر — التحقق من الموقع مفعّل` : "ما تحدد بعد — التحقق من الموقع غير مفعّل حاليًا"}</div>
        </div>

        ${onDutyPlatoons.length === 0 ? `<div class="empty">ما عندك فصائل بـ${escapeHtml(onDutyUnit?.name||"")} بعد — أضفها من تبويب «الطاقم».</div>` : onDutyPlatoons.map(p => {

          return `

              </select>
            </div>
          `;
        }).join("")}
      </div>

      ${allUnitMembers.length === 0 ? `<div class="empty">لا يوجد أفراد بـ${escapeHtml(onDutyUnit?.name||"")} بعد — أضفهم من تبويب «الطاقم».</div>` : ""}
      <div class="shiftGrid">

          const shiftMembers = shiftMembersMap[shift.id];
          const platoonNames = planRows.filter(r => r.shift===shift.id && onDutyPlatoons.some(p=>p.id===r.platoon_id)).map(r => onDutyPlatoons.find(p=>p.id===r.platoon_id)?.name).filter(Boolean);
          return `
            <div class="shiftCard">
              <div class="shiftHeader" style="color:${shift.color}"><span>${shift.label}</span><span style="font-size:12px;color:#8A97A8">${shift.range}</span></div>

  function renderMemberRow(member, rec, shift, now, isToday) {
    const status = rec?.status;
    let progressHtml = "";
    if (status === "present" && rec?.time_in && isToday) {
      const [h,m] = rec.time_in.split(":").map(Number);
      const start = new Date(now); start.setHours(h,m,0,0);
      const elapsed = now - start; const total = 8*3600*1000;
      const pct = Math.max(0, Math.min(1, elapsed/total));
      const done = elapsed >= total;
      const doneAt = new Date(start.getTime()+total);
      progressHtml = `
        <div style="margin-top:6px">
          <div style="height:6px;background:#1E2B41;border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct*100}%;background:${done?'#2FAE60':shift.color}"></div>
          </div>
          <div style="font-size:11px;color:${done?'#2FAE60':'#8A97A8'};margin-top:3px">
            ${done ? "أنهى النوبة ✅ (٨ ساعات)" : `قيد النوبة — تنتهي حوالي ${pad(doneAt.getHours())}:${pad(doneAt.getMinutes())}`}
          </div>
        </div>`;
    }
    let geoHtml = "";
    if (status === "present" && rec?.geo) {
      const g = rec.geo;
      let rangeHtml = "";
      if (typeof g.in_range === "boolean") {
        rangeHtml = g.in_range
          ? `<div style="font-size:11px;color:#2FAE60;margin-top:2px">✔ داخل نطاق القاعدة</div>`
          : `<div style="font-size:11px;color:#D64545;margin-top:2px">⚠️ خارج نطاق القاعدة (تقريبًا <span class="mono">${g.distance_m}</span> م)</div>`;
      }
      geoHtml = `<a class="geoLink" href="https://www.google.com/maps?q=${g.lat},${g.lng}" target="_blank">📍 موقع الحضور على الخريطة (دقة ~${g.accuracy} م)</a>${rangeHtml}`;
    } else if (status === "present" && rec?.verified) {
      geoHtml = `<div class="geoNote">لم يتم تحديد الموقع (رفض الإذن أو غير متاح)</div>`;
    }
    return `
      <div class="memberRow" id="row-${member.id}">
        <div class="memberRowTop">
          <span>${escapeHtml(member.name)}</span>
        </div>
        <div class="pillsRow">
          <button class="pill ${status==='present'?'active':''}" data-status="present" data-memberid="${member.id}" style="border-color:${STATUS.present.color};color:${status==='present'?'#0F1720':STATUS.present.color};${status==='present'?`background:${STATUS.present.color}`:''}">حاضر</button>
          ${Object.entries(STATUS).filter(([k])=>k!=='present').map(([k,s]) => `
            <button class="pill ${status===k?'active':''}" data-status="${k}" data-memberid="${member.id}" style="border-color:${s.color};color:${status===k?'#0F1720':s.color};${status===k?`background:${s.color}`:''}">${s.label}</button>
          `).join("")}
        </div>
        <div id="verifyHolder-${member.id}"></div>
        ${status === "present" ? `
          <div class="timeRow">
            🕐 وقت الحضور
            <input type="time" value="${rec.time_in||''}" data-timein="${member.id}" />
            ${rec.verified ? `<span style="color:#2FAE60">✔ مؤكد بالرمز</span>` : ""}
          </div>
          ${geoHtml}
          ${progressHtml}
        ` : ""}
      </div>
    `;
  }

  function openVerify(memberId) {
    const holder = document.getElementById(`verifyHolder-${memberId}`);
    if (!holder) return;
    holder.innerHTML = `
      <div class="verifyBox">
        🔑
        <input type="password" inputmode="numeric" placeholder="رمز الفرد" id="pinInput-${memberId}" />
        <button class="miniBtn" id="pinConfirm-${memberId}">تأكيد</button>

      </div>
    `;
    document.getElementById(`pinCancel-${memberId}`).onclick = () => { holder.innerHTML = ""; };
    document.getElementById(`pinConfirm-${memberId}`).onclick = async () => {
      const val = document.getElementById(`pinInput-${memberId}`).value;
      const member = MEMBERS.find(m => m.id === memberId);
      if (val !== member.pin) {
        document.getElementById(`pinInput-${memberId}`).style.borderColor = "#D64545";
        return;
      }
      const btn = document.getElementById(`pinConfirm-${memberId}`);
      btn.disabled = true; btn.textContent = "...جارِ تحديد الموقع";
      const geo = await getGeo();
      if (geo && BASE_LOCATION) {
        const dist = haversineDistanceMeters(geo.lat, geo.lng, BASE_LOCATION.lat, BASE_LOCATION.lng);
        geo.distance_m = Math.round(dist);
        geo.in_range = dist <= BASE_LOCATION.radius;
      }
      const now = new Date();
      const hh = pad(now.getHours()), mm = pad(now.getMinutes());
      await upsertAttendance(memberId, currentDate, { status:"present", verified:true, geo, time_in: hh+":"+mm });
      renderDuty();
    };
  }

  function openBaseLocationPicker() {
    const overlay = document.createElement("div");
    overlay.id = "mapModalOverlay";
    overlay.style.cssText = "position:fixed;inset:0;background:#000000cc;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px";
    overlay.innerHTML = `
      <div style="background:#141F2E;border:1px solid #1E2B41;border-radius:14px;padding:16px;max-width:480px;width:100%">
        <div style="font-weight:800;margin-bottom:8px">📍 حدد موقع القاعدة</div>
        <div style="font-size:12px;color:#8A97A8;margin-bottom:8px">دوس عالخريطة لتحديد نقطة القاعدة، أو استخدم موقعك الحالي إذا واقف فيها</div>
        <div id="pickerMap" style="height:280px;border-radius:10px;overflow:hidden;margin-bottom:10px"></div>
        <button class="smallBtn" id="useMyLocBtn" style="margin-bottom:10px">📌 استخدم موقعي الحالي</button>
        <div style="font-size:12px;margin-bottom:6px">نصف قطر القبول: <b id="radiusVal">${BASE_LOCATION?.radius || 150}</b> متر</div>
        <input type="range" id="radiusSlider" min="20" max="1000" step="10" value="${BASE_LOCATION?.radius || 150}" style="width:100%;margin-bottom:12px" />
        <div style="display:flex;gap:8px">
          <button id="saveBaseLocBtn" style="flex:1">حفظ</button>
          <button class="ghost" id="cancelBaseLocBtn" style="flex:1">إلغاء</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const startLat = BASE_LOCATION?.lat ?? 33.8886;
    const startLng = BASE_LOCATION?.lng ?? 35.4955;
    const map = L.map("pickerMap").setView([startLat, startLng], BASE_LOCATION ? 16 : 8);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);

    let marker = null, circle = null;
    let picked = BASE_LOCATION ? { lat: startLat, lng: startLng } : null;

    function placeMarker(lat, lng) {
      picked = { lat, lng };
      const radius = +document.getElementById("radiusSlider").value;
      if (marker) marker.setLatLng([lat, lng]); else marker = L.marker([lat, lng]).addTo(map);
      if (circle) circle.setLatLng([lat, lng]).setRadius(radius); else circle = L.circle([lat, lng], { radius, color: "#2DD4BF" }).addTo(map);
    }
    if (picked) placeMarker(picked.lat, picked.lng);

    map.on("click", (e) => placeMarker(e.latlng.lat, e.latlng.lng));

    document.getElementById("radiusSlider").oninput = (e) => {
      document.getElementById("radiusVal").textContent = e.target.value;
      if (circle) circle.setRadius(+e.target.value);
    };

    document.getElementById("useMyLocBtn").onclick = async () => {
      const geo = await getGeo();
      if (geo) { map.setView([geo.lat, geo.lng], 17); placeMarker(geo.lat, geo.lng); }
    };

    document.getElementById("cancelBaseLocBtn").onclick = () => overlay.remove();
    document.getElementById("saveBaseLocBtn").onclick = async () => {
      if (!picked) { alert("دوس عالخريطة أول لتحديد نقطة"); return; }
      const radius = +document.getElementById("radiusSlider").value;
      await setBaseLocation({ lat: picked.lat, lng: picked.lng, radius });
      BASE_LOCATION = await getBaseLocation();
      overlay.remove();
      renderDuty();
    };
  }

  function getGeo() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat:+pos.coords.latitude.toFixed(5), lng:+pos.coords.longitude.toFixed(5), accuracy:Math.round(pos.coords.accuracy) }),
        () => resolve(null),
        { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
      );
    });
  }

    document.getElementById("regName").addEventListener("blur", async (e) => {

      if (!name) { warnEl.style.display = "none"; return; }
      const { data: exists } = await sb.rpc("check_name_exists", { p_name: name });
      warnEl.style.display = exists ? "block" : "none";
    });

    const unitSel = document.getElementById("regUnit");
    const platoonSel = document.getElementById("regPlatoon");

    roleSel.onchange = () => {

    function applyNoSquadMode(on) {
      platoonSel.disabled = on || !unitSel.value;
      squadSel.disabled = on || !platoonSel.value;
      if (on) shiftInfo.textContent = "هالدور مستقل عن نظام النوبات — بيسجّل بس تحت السرية.";
      else shiftInfo.textContent = "";
    }
    noSquadCb.onchange = () => applyNoSquadMode(noSquadCb.checked);

    unitSel.onchange = () => {
      const uid = unitSel.value;
      const platoons = [...new Map(hierarchy.filter(r => r.unit_id === uid).map(r => [r.platoon_id, r.platoon_name])).entries()];
      platoonSel.disabled = !uid;
      platoonSel.innerHTML = `<option value="">اختر الفصيلة</option>${platoons.map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("")}`;
      squadSel.disabled = true;
      squadSel.innerHTML = `<option value="">اختر الفصيلة أولًا</option>`;
      shiftInfo.textContent = "";
    };
    platoonSel.onchange = () => {
      const pid = platoonSel.value;
      const squads = hierarchy.filter(r => r.platoon_id === pid).map(r => [r.squad_id, r.squad_name]);
      squadSel.disabled = !pid;
      squadSel.innerHTML = `<option value="">اختر المجموعة</option>${squads.map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("")}`;
      shiftInfo.textContent = "";
    };
    squadSel.onchange = async () => {
      const pid = platoonSel.value;
      if (!pid) return;
      shiftInfo.textContent = "...جارِ تحديد النوبة الحالية";
      const { data } = await sb.rpc("public_current_shift", { p_platoon_id: pid });
      const row = Array.isArray(data) ? data[0] : data;
      if (!row || !row.on_duty) {
        shiftInfo.textContent = "فصيلتك مستريحة هالأسبوع (سريتك مو مناوبة)";
      } else if (!row.shift) {
        shiftInfo.textContent = "الفصيلة مناوبة، بس لسا ما تحدد إلها نوبة معيّنة";
      } else {
        const s = SHIFTS.find(x => x.id === row.shift);
        shiftInfo.textContent = `نوبتك الحالية: ${s ? s.label : row.shift} (${s ? s.range : ""})`;
      }
    };

    document.getElementById("regSubmit").onclick = async () => {
      const name = document.getElementById("regName").value.trim();
      const isNoSquad = noSquadCb.checked;
      const squadId = isNoSquad ? null : squadSel.value;
      const unitIdVal = unitSel.value;
      const errEl = document.getElementById("regErr");
      const sensitiveFields = {
        p_full_name_triple: document.getElementById("regFullNameTriple").value.trim(),
        p_mother_name: document.getElementById("regMotherName").value.trim(),
        p_national_id: document.getElementById("regNationalId").value.trim(),
        p_sham_cash_account: document.getElementById("regShamCash").value.trim(),
        p_birth_date: document.getElementById("regBirthDate").value || null,
        p_personal_number: document.getElementById("regPersonalNumber").value.trim(),
        p_current_residence: document.getElementById("regCurrentResidence").value.trim(),
        p_permanent_residence: document.getElementById("regPermanentResidence").value.trim(),
        p_registration_number: document.getElementById("regRegistrationNumber").value.trim(),
        p_job_title: document.getElementById("regJobTitle").value.trim(),
      };
      if (!name) { errEl.textContent = "اكتب اسمك"; return; }
      if (isNoSquad) { if (!unitIdVal) { errEl.textContent = "اختر السرية"; return; } }
      else if (!squadId) { errEl.textContent = "اختر المجموعة"; return; }
      const dupWarnVisible = document.getElementById("regNameWarn").style.display !== "none";
      const dupConfirmed = document.getElementById("regDupConfirm")?.checked;
      if (dupWarnVisible && !dupConfirmed) { errEl.textContent = "فيه فرد بنفس الاسم أصلاً — أكّد إنك شخص مختلف بالمربّع فوق، أو ارجع لـ\"دخول\" لو انت هو نفسه."; return; }
      for (const [key, val] of Object.entries(sensitiveFields)) {
        if (!val) { errEl.textContent = "لازم تعبّي كل الحقول الإضافية (البيانات السرّية) قبل ما تكملي التسجيل"; return; }
      }
      errEl.textContent = "";
      const btn = document.getElementById("regSubmit");
      btn.disabled = true; btn.textContent = "...";
      const rpcArgs = isNoSquad ? { p_name: name, p_squad_id: null, p_unit_id: unitIdVal } : { p_name: name, p_squad_id: squadId };
      const { data, error } = await sb.rpc("self_register", rpcArgs);
      const result = Array.isArray(data) ? data[0] : data;
      if (error || !result) {
        btn.disabled = false; btn.textContent = "تسجيل";
        errEl.textContent = "صار خطأ، جرب مرة ثانية.";
        return;
      }
      const { error: sensErr } = await sb.rpc("save_member_sensitive_info", {
        p_member_id: result.member_id, p_pin: result.pin, ...sensitiveFields,
      });
      const roleVal = document.getElementById("regRole").value;
      Promise.resolve(sb.rpc("set_member_role", { p_member_id: result.member_id, p_pin: result.pin, p_role: roleVal })).catch(() => {});
      saveCreds(result.member_id, result.pin);
      renderRegisterSuccess(name, result.pin, result.member_id, !!sensErr);
    };
  }

  // ---------- Public daily self check-in (name + PIN, manual fallback for a new device) ----------
  function renderCheckinLogin(prefill) {
    app.innerHTML = `
      <div class="authScreen"><div class="glassCard">
        ${SEAL_SVG}
        <h1>تسجيل الدخول</h1>
        <p style="margin-bottom:24px">اكتب اسمك ورمزك الشخصي</p>

          <label>الاسم الكامل</label>
          <div class="inputWrap">
            <input type="text" id="ciName" placeholder="اسمك الكامل" value="${escapeHtml(prefill?.name||"")}" />
            <span class="fIcon">👤</span>
          </div>
        </div>
        <div class="glassField">
          <label style="text-align:center;display:block">الرمز الشخصي (٤ أرقام)</label>
          <div class="otpRow">
            <input class="otpBox" type="tel" inputmode="numeric" maxlength="1" data-otp="0" autocomplete="one-time-code" />
            <input class="otpBox" type="tel" inputmode="numeric" maxlength="1" data-otp="1" />
            <input class="otpBox" type="tel" inputmode="numeric" maxlength="1" data-otp="2" />
            <input class="otpBox" type="tel" inputmode="numeric" maxlength="1" data-otp="3" />
          </div>
        </div>
        <div class="glassHint">🔑 نسيت رمزك؟ تواصل مع قائدك المباشر</div>
        <button class="glassBtn" id="ciSubmit">دخول</button>
        <div id="ciErr" class="glassErr"></div>
        <div class="glassBottom">ما عندك حساب؟ <b id="ciChoiceBackBtn">سجّل الآن</b></div>
      </div></div>
    `;
    document.getElementById("ciChoiceBackBtn").onclick = () => renderCheckinChoice();

    const otpBoxes = Array.from(document.querySelectorAll(".otpBox"));
    const getOtpValue = () => otpBoxes.map(b => b.value).join("");
    const clearOtpError = () => otpBoxes.forEach(b => b.classList.remove("otpErr"));
    otpBoxes.forEach((box, i) => {
      box.addEventListener("input", () => {
        box.value = box.value.replace(/[^0-9]/g, "").slice(-1);
        box.classList.toggle("filled", !!box.value);
        clearOtpError();
        if (box.value && i < otpBoxes.length - 1) otpBoxes[i + 1].focus();
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !box.value && i > 0) { otpBoxes[i - 1].focus(); otpBoxes[i - 1].value = ""; otpBoxes[i - 1].classList.remove("filled"); }
        if (e.key === "Enter") document.getElementById("ciSubmit").click();
      });
      box.addEventListener("paste", (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData("text") || "").replace(/[^0-9]/g, "").split("").slice(0, 4);
        digits.forEach((d, idx) => { if (otpBoxes[idx]) { otpBoxes[idx].value = d; otpBoxes[idx].classList.add("filled"); } });
        (otpBoxes[digits.length - 1] || otpBoxes[0]).focus();
      });
    });
    if (otpBoxes[0]) otpBoxes[0].focus();

    document.getElementById("ciSubmit").onclick = async () => {
      const name = document.getElementById("ciName").value.trim();
      const pin = getOtpValue();
      const errEl = document.getElementById("ciErr");
      if (!name || pin.length < 4) {
        errEl.textContent = "عبّي اسمك والرمز كامل (٤ أرقام)";
        if (pin.length < 4) otpBoxes.forEach(b => b.classList.add("otpErr"));
        return;
      }
      errEl.textContent = "";
      const btn = document.getElementById("ciSubmit");
      btn.disabled = true; btn.textContent = "...";
      const { data, error } = await sb.rpc("member_login", { p_name: name, p_pin: pin });
      const row = Array.isArray(data) ? data[0] : data;
      if (error || !row) {
        btn.disabled = false; btn.textContent = "دخول";
        otpBoxes.forEach(b => { b.classList.add("otpErr"); b.value = ""; b.classList.remove("filled"); });
        otpBoxes[0].focus();
        errEl.textContent = (error?.message||"").includes("locked")
          ? "🔒 محاولات كتير خاطئة — جرب بعد دقيقتين."
          : "الاسم أو الرمز غير صحيح، جرب مرة ثانية.";
        return;
      }
      saveCreds(row.member_id, pin);
      renderLoginSuccess(row, pin);
    };
  }

  function isNowWithinShift(shiftId) {
    const s = SHIFTS.find(x => x.id === shiftId);
    if (!s) return null;
    const start = new Date(`${todayISO()}T${pad(s.start)}:00:00`);
    const end = new Date(start.getTime() + 8 * 3600 * 1000);
    const now = new Date();
    if (now < start) return "before";
    if (now >= end) return "after";
    return "within";
  }

    if (!row.on_duty) return;
    try {
      const { data } = await sb.rpc("get_emergency_broadcast");
      if (!data || !data.message || !data.sent_at) return;
      const seenKey = "emergencySeen_" + data.sent_at;
      if (localStorage.getItem(seenKey)) return;
      const box = document.getElementById("emergencyBannerBox");
      if (!box) return;
      box.innerHTML = `

          <div style="font-size:13.5px;color:#F1D4D4;line-height:1.7;margin-bottom:10px">${escapeHtml(data.message)}</div>
          <button id="emergencyDismissBtn" style="width:100%;background:#D64545;border-color:#D64545">فهمت ✔</button>
        </div>

  async function renderCommanderPanel(row, pin) {
    document.body.classList.add("cmd-theme");
    app.innerHTML = `<div class="skeletonWrap"><div class="skelCard"></div><div class="skelCard"></div><div class="skelCard"></div></div>`;
    Promise.resolve(sb.rpc("touch_last_seen", { p_member_id: row.member_id })).catch(() => {});
    const [{ data: ctx }, { data: reqs }, { data: swaps }, { data: violations }, { data: scopeMembers }] = await Promise.all([
      sb.rpc("commander_get_context", { p_member_id: row.member_id, p_pin: pin }),
      sb.rpc("commander_list_requests", { p_member_id: row.member_id, p_pin: pin }),
      sb.rpc("commander_list_swaps", { p_member_id: row.member_id, p_pin: pin }),
      sb.rpc("commander_list_violations", { p_member_id: row.member_id, p_pin: pin }),
      sb.rpc("commander_list_members", { p_member_id: row.member_id, p_pin: pin }),
    ]);

    if (!ctx || !ctx.is_commander) { renderCheckinInfo(row, pin); return; }

    const REQ_TYPE_LABEL = { sick: "مرض", travel: "سفر", leave: "إجازة", excuse: "عذر" };
    const STATUS_BADGE = { pending: { c: "#2DD4BF", t: "بانتظار الموافقة" }, approved: { c: "#2FAE60", t: "✔ مُوافَق عليه" }, rejected: { c: "#D64545", t: "✕ مرفوض" } };

    const reqRows = (reqs || []).map(r => {
      const b = STATUS_BADGE[r.status] || { c: "#8A97A8", t: r.status };
      return `
        <div class="formCard" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-weight:800">${escapeHtml(r.member_name)}</div>
            <div style="font-size:11px;font-weight:800;color:${b.c}">${b.t}</div>
          </div>
          <div style="font-size:12px;color:#C7D0DC;margin-bottom:6px">${REQ_TYPE_LABEL[r.type] || r.type} — ${r.date}${r.note ? ` — ${escapeHtml(r.note)}` : ""}</div>
          ${r.status === "pending" ? `
            <div style="display:flex;gap:8px">
              <button class="approveBtn" data-creqapprove="${r.id}">✔ موافقة</button>
              <button class="rejectBtn" data-creqreject="${r.id}">✕ رفض</button>
            </div>` : ""}
        </div>`;
    }).join("") || `<div style="font-size:12px;color:#8A97A8;text-align:center;padding:10px">ما في طلبات</div>`;

    const swapRows = (swaps || []).map(s => {
      const b = STATUS_BADGE[s.status] || { c: "#8A97A8", t: s.status };
      return `
        <div class="formCard" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-weight:800">${escapeHtml(s.requester_name)} ↔ ${escapeHtml(s.partner_name || "—")}</div>
            <div style="font-size:11px;font-weight:800;color:${b.c}">${b.t}</div>
          </div>
          <div style="font-size:12px;color:#C7D0DC;margin-bottom:6px">تاريخ التبديل: ${s.swap_date}${s.note ? ` — ${escapeHtml(s.note)}` : ""}</div>
          ${s.status === "pending" ? `
            <div style="display:flex;gap:8px">
              <button class="approveBtn" data-cswapapprove="${s.id}">✔ موافقة</button>
              <button class="rejectBtn" data-cswapreject="${s.id}">✕ رفض</button>
            </div>` : ""}
        </div>`;
    }).join("") || `<div style="font-size:12px;color:#8A97A8;text-align:center;padding:10px">ما في طلبات تبديل</div>`;

    const violRows = (violations || []).map(v => {
      const badgeColor = v.status === "resolved" ? "#2FAE60" : "#D64545";
      return `
        <div class="formCard" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-weight:800">${escapeHtml(v.member_name)}</div>
            <div style="font-size:11px;font-weight:800;color:${badgeColor}">${VIOLATION_STATUS_LABEL[v.status] || v.status}</div>
          </div>
          <div style="font-size:12px;color:#C7D0DC;margin-bottom:4px">📅 ${v.date || ""}</div>
          <div style="font-size:13px">${escapeHtml(v.description || "")}${v.penalty ? ` — العقوبة: ${escapeHtml(v.penalty)}` : ""}</div>
        </div>`;
    }).join("") || `<div style="font-size:12px;color:#8A97A8;text-align:center;padding:10px">ما في مخالفات</div>`;

    const violMemberOptions = (scopeMembers || []).map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join("");

    const statusKeyOf = (m) => m.status || m.today_status || m.attendance_status || m.state || null;
    const rosterSorted = [...(scopeMembers || [])].sort((a, b) => {
      const rank = { absent: 0, sick: 1, excuse: 1, travel: 1, leave: 1, present: 2 };
      const ra = rank[statusKeyOf(a)] ?? 1.5, rb = rank[statusKeyOf(b)] ?? 1.5;
      if (ra !== rb) return ra - rb;

  async function renderDriverRouteScreen(row, pin) {
    app.innerHTML = `<div class="center"><div class="card"><div class="skeletonWrap"><div class="skelCard" style="height:300px"></div></div></div></div>`;
    const [{ data: points, error: pErr }, { data: edges }] = await Promise.all([
      sb.from("route_points").select("*").order("created_at", { ascending: true }),
      sb.from("route_edges").select("*"),
    ]);

    if (pErr || !points || points.length < 2) {
      app.innerHTML = `
        <div class="center"><div class="card">
          <h1 style="text-align:center">🧭 مساري اليوم</h1>
          <div class="formCard" style="text-align:center">
            <div style="font-size:13px;color:#8A97A8">ما في نقاط كافية محفوظة بعد. لازم المسؤول يضيف نقاط الموقع أول من تبويب "النقاط والمسارات".</div>
          </div>
          <button class="ghost" id="routeBackBtn" style="width:100%;margin-top:10px">🔙 رجوع</button>
        </div></div>`;
      document.getElementById("routeBackBtn").onclick = () => renderCheckinInfo(row, pin);
      return;
    }

    const pointById = {};
    points.forEach(p => { pointById[p.id] = p; });
    const haversine = (a, b) => {
      const R = 6371000, toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
      const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
    };

    app.innerHTML = `
      <div class="center"><div class="card" style="max-width:440px">
        <h1 style="text-align:center">🧭 مساري اليوم</h1>
        <p style="text-align:center;font-size:12px;color:#8A97A8">اختار نقطة الانطلاق والوجهة، وشوف أقرب طريق فورًا — بيتحدث تلقائيًا كل مرة تفتحها.</p>
        <select id="drFromSel" style="margin-bottom:8px"><option value="">— من نقطة —</option>${points.map(p=>`<option value="${p.id}">${p.kind==="internal"?"🏠":"🛣️"} ${escapeHtml(p.name)}</option>`).join("")}</select>
        <select id="drToSel" style="margin-bottom:10px"><option value="">— إلى نقطة —</option>${points.map(p=>`<option value="${p.id}">${p.kind==="internal"?"🏠":"🛣️"} ${escapeHtml(p.name)}</option>`).join("")}</select>
        <button id="drCalcBtn" style="width:100%">🧭 احسب مساري</button>
        <div id="drResult" style="margin-top:12px"></div>
        <div id="drMap" style="height:280px;border-radius:12px;overflow:hidden;margin-top:12px;border:1px solid rgba(45,212,191,.2);display:none"></div>
        <button class="ghost" id="routeBackBtn" style="width:100%;margin-top:12px">🔙 رجوع لسجلّي</button>
      </div></div>
    `;
    document.getElementById("routeBackBtn").onclick = () => renderCheckinInfo(row, pin);

    function shortestPath(startId, endId) {
      const graph = {};
      points.forEach(p => { graph[p.id] = []; });
      (edges || []).forEach(e => {
        if (!graph[e.point_a] || !graph[e.point_b]) return;
        graph[e.point_a].push({ to: e.point_b, dist: e.distance_m });
        graph[e.point_b].push({ to: e.point_a, dist: e.distance_m });
      });
      const dist = {}, prev = {};
      Object.keys(graph).forEach(id => { dist[id] = Infinity; });
      dist[startId] = 0;
      const queue = new Set(Object.keys(graph));
      const visited = new Set();
      while (queue.size) {
        let u = null, best = Infinity;
        queue.forEach(id => { if (dist[id] < best) { best = dist[id]; u = id; } });
        if (u === null) break;
        queue.delete(u); visited.add(u);
        if (u === endId) break;
        (graph[u] || []).forEach(edge => {
          if (visited.has(edge.to)) return;
          const alt = dist[u] + edge.dist;
          if (alt < dist[edge.to]) { dist[edge.to] = alt; prev[edge.to] = u; }
        });
      }
      if (dist[endId] === Infinity) return null;
      const path = [endId]; let cur = endId;
      while (prev[cur]) { cur = prev[cur]; path.unshift(cur); }
      return { path, distance: dist[endId] };
    }

    document.getElementById("drCalcBtn").onclick = async () => {
      const fromId = document.getElementById("drFromSel").value;
      const toId = document.getElementById("drToSel").value;
      const resultBox = document.getElementById("drResult");
      const mapBox = document.getElementById("drMap");
      if (!fromId || !toId || fromId === toId) { showToast("اختار نقطتين مختلفتين", "err"); return; }
      const calcBtn = document.getElementById("drCalcBtn");
      calcBtn.disabled = true; calcBtn.textContent = "...جارِ حساب أدق مسار";
      const result = shortestPath(fromId, toId);
      calcBtn.disabled = false; calcBtn.textContent = "🧭 احسب مساري";
      if (!result) {
        mapBox.style.display = "none";
        resultBox.innerHTML = `<div style="color:#D64545;font-size:12.5px">🚫 ما في مسار مربوط بين هاي النقطتين حاليًا. تواصل مع المسؤول.</div>`;
        return;
      }

      // اجلب مسار ملاحة حقيقي بتعليمات تفصيلية (Turn-by-turn) عبر كل النقاط بالتسلسل
      let steps = [], fullCoords = [], realDistance = result.distance;
      try {
        const coordsStr = result.path.map(id => `${pointById[id].lng},${pointById[id].lat}`).join(";");
        const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === "Ok" && data.routes && data.routes[0]) {
          const route = data.routes[0];
          realDistance = route.distance;
          fullCoords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          route.legs.forEach(leg => leg.steps.forEach(st => {
            if (st.distance < 3 && steps.length) return; // تجاهل خطوات مجهرية
            steps.push({ maneuver: st.maneuver, distance: st.distance, name: st.name });
          }));
        }
      } catch (e) { /* رح نعتمد على الهندسة المخزّنة بالأسفل كاحتياط */ }

      if (!fullCoords.length) {
        for (let i = 0; i < result.path.length - 1; i++) {
          const aId = result.path[i], bId = result.path[i + 1];
          const edge = (edges || []).find(e => (e.point_a === aId && e.point_b === bId) || (e.point_a === bId && e.point_b === aId));
          let seg = (edge && edge.geometry && edge.geometry.length > 1)
            ? (edge.point_a === aId ? edge.geometry.slice() : edge.geometry.slice().reverse())
            : [[pointById[aId].lat, pointById[aId].lng], [pointById[bId].lat, pointById[bId].lng]];
          if (fullCoords.length > 0) seg = seg.slice(1);
          fullCoords.push(...seg);
        }
      }

      const km = (realDistance / 1000).toFixed(2);
      const walkMin = Math.round(realDistance / 80);
      const driveMin = Math.max(1, Math.round(realDistance / 1000 / 30 * 60));
      resultBox.innerHTML = `
        <div style="background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);border-radius:10px;padding:14px">
          <div style="font-weight:900;font-size:16px;color:#2DD4BF">${km} كم</div>
          <div style="font-size:11.5px;color:#8A97A8;margin-bottom:8px">🚶 ~${walkMin} د مشي &nbsp;|&nbsp; 🚗 ~${driveMin} د قيادة</div>
          <div style="font-size:12px;color:#B9C3D1;font-weight:700;margin-bottom:10px">🏁 ${result.path.map(id => escapeHtml(pointById[id].name)).join(" ← ")} 🎯</div>
          ${steps.length ? `<button id="startNavBtn" style="width:100%">🧭 ابدأ الملاحة خطوة بخطوة</button>` : ""}
        </div>`;
      haptic();

      mapBox.style.display = "block";
      mapBox.innerHTML = "";
      const map = L.map("drMap").setView(fullCoords[0], 16);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "© Esri" }).addTo(map);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png", { attribution: "© CARTO", subdomains: "abcd", opacity: .9 }).addTo(map);
      const startIcon = L.divIcon({ className:"", html:`<div style="font-size:24px">🏁</div>`, iconSize:[24,24], iconAnchor:[12,24] });
      const endIcon = L.divIcon({ className:"", html:`<div style="font-size:24px">🎯</div>`, iconSize:[24,24], iconAnchor:[12,24] });
      L.marker(fullCoords[0], { icon: startIcon }).addTo(map);
      L.marker(fullCoords[fullCoords.length-1], { icon: endIcon }).addTo(map);
      const glowLine = L.polyline(fullCoords, { color: "#2DD4BF", weight: 12, opacity: .22, className: "routeGlowLine" }).addTo(map);
      L.polyline(fullCoords, { color: "#8FFFF0", weight: 4, opacity: 1 }).addTo(map);
      map.fitBounds(L.polyline(fullCoords).getBounds(), { padding: [30, 30] });

      const startNavBtn = document.getElementById("startNavBtn");
      if (startNavBtn) startNavBtn.onclick = () => startTurnByTurnNav(row, pin, steps, fullCoords, pointById[toId].name);
    };
  }

  function maneuverInfo(step) {
    const m = step.maneuver || {};
    const street = step.name ? ` — ${step.name}` : "";
    if (m.type === "depart") return { icon: "🚦", text: "ابدأ المسير" + street };
    if (m.type === "arrive") return { icon: "🏁", text: "وصلت للوجهة" };
    if (m.type === "roundabout" || m.type === "rotary") return { icon: "🔄", text: "ادخل الدوّار" + street };
    const mod = m.modifier || "";
    if (mod === "left") return { icon: "⬅️", text: "انعطف يسار" + street };
    if (mod === "right") return { icon: "➡️", text: "انعطف يمين" + street };
    if (mod === "slight left") return { icon: "↖️", text: "انحرف شوي يسار" + street };
    if (mod === "slight right") return { icon: "↗️", text: "انحرف شوي يمين" + street };
    if (mod === "sharp left") return { icon: "↩️", text: "انعطف حاد يسار" + street };
    if (mod === "sharp right") return { icon: "↪️", text: "انعطف حاد يمين" + street };
    if (mod === "uturn") return { icon: "🔙", text: "لفّة كاملة (رجوع)" };
    return { icon: "⬆️", text: "استمر مباشرة" + street };
  }

            <div id="navDistance" style="font-size:12.5px;color:#2DD4BF;font-weight:800;margin-top:2px"></div>
          </div>
          <button id="navEndBtn" style="flex-shrink:0;background:#D64545;border-color:#D64545;padding:8px 12px;font-size:12px">إنهاء</button>
        </div>
        <div style="position:relative;flex:1">
          <div id="navMap" style="position:absolute;inset:0"></div>
          <div id="navAccBadge" style="position:absolute;bottom:14px;left:12px;z-index:600;background:rgba(10,15,22,.75);backdrop-filter:blur(8px);border:1px solid rgba(45,212,191,.35);border-radius:8px;padding:5px 10px;font-size:10.5px;color:#2DD4BF;font-weight:800"></div>
          <button id="navRecenterBtn" style="position:absolute;bottom:14px;right:12px;z-index:600;width:42px;height:42px;border-radius:50%;background:rgba(10,15,22,.8);border:1.5px solid rgba(45,212,191,.4);font-size:18px">🎯</button>
        </div>
        <div id="navStepsPanel" style="max-height:32%;overflow-y:auto;background:rgba(10,15,22,.95);border-top:1px solid rgba(45,212,191,.2);padding:8px 14px"></div>
      </div>
    `;

    const cartoLabelTiles = ["a","b","c","d"].map(s => `https://${s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}.png`);
    const map = new maplibregl.Map({
      container: "navMap",
      style: {
        version: 8,
        sources: {
          sat: { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, attribution: "© Esri" },
          labels: { type: "raster", tiles: cartoLabelTiles, tileSize: 256, attribution: "© CARTO" },
        },
        layers: [
          { id: "sat", type: "raster", source: "sat" },
          { id: "labels", type: "raster", source: "labels", paint: { "raster-opacity": 0.92 } },
        ],
      },
      center: [routeCoords[0][1], routeCoords[0][0]],
      zoom: 18, pitch: 62, bearing: 0, antialias: true,
      attributionControl: false,
    });

    let liveMarkerEl = null, liveMarker = null, destMarker = null, currentHeading = 0, followMode = true;

    map.on("load", () => {
      map.addSource("route", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: routeCoords.map(c => [c[1], c[0]]) } } });
      map.addLayer({ id: "route-glow", type: "line", source: "route", paint: { "line-color": "#2DD4BF", "line-width": 16, "line-opacity": .22, "line-blur": 3 }, layout: { "line-cap": "round", "line-join": "round" } });
      map.addLayer({ id: "route-line", type: "line", source: "route", paint: { "line-color": "#8FFFF0", "line-width": 5 }, layout: { "line-cap": "round", "line-join": "round" } });

      const destEl = document.createElement("div");
      destEl.style.fontSize = "26px";
      destEl.textContent = "🎯";
      destMarker = new maplibregl.Marker({ element: destEl, anchor: "bottom" })
        .setLngLat([routeCoords[routeCoords.length - 1][1], routeCoords[routeCoords.length - 1][0]])
        .addTo(map);
    });

    // مؤشر الموقع الحي: سهم ثلاثي الأبعاد يدور مع اتجاه الحركة الفعلي (رفرف حي + توهج)
    liveMarkerEl = document.createElement("div");
    liveMarkerEl.style.cssText = "position:relative;width:34px;height:34px";
    liveMarkerEl.innerHTML = `
      <div style="position:absolute;inset:-10px;border-radius:50%;background:#3B82C4;opacity:.32;animation:mapPulse 1.6s ease-out infinite"></div>
      <svg viewBox="0 0 24 24" width="34" height="34" style="filter:drop-shadow(0 2px 5px rgba(0,0,0,.6)) drop-shadow(0 0 8px #3B82C4)">
        <path d="M12 2 L19 20 L12 16 L5 20 Z" fill="#3B82C4" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>`;

    function applyHeading(deg) {
      currentHeading = deg;
      if (liveMarker) liveMarker.setRotation(deg);
      if (followMode) map.easeTo({ bearing: deg, duration: 500 });
    }

    // بوصلة الجهاز (Device Orientation) كمصدر احتياطي لما ما يكون في حركة كافية لـGPS heading
    function enableDeviceCompass() {
      const handler = (e) => {
        let heading = null;
        if (typeof e.webkitCompassHeading === "number") heading = e.webkitCompassHeading;
        else if (e.absolute && e.alpha != null) heading = 360 - e.alpha;
        if (heading != null && !Number.isNaN(heading)) applyHeading(heading);
      };
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === "granted") window.addEventListener("deviceorientation", handler);
        }).catch(() => {});
      } else if (typeof DeviceOrientationEvent !== "undefined") {
        window.addEventListener("deviceorientationabsolute", handler);
        window.addEventListener("deviceorientation", handler);
      }
    }
    enableDeviceCompass();

    const haversine = (a, b) => {
      const R = 6371000, toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
      const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
    };

    let stepIdx = 0;
    function renderStepsPanel() {
      const panel = document.getElementById("navStepsPanel");
      panel.innerHTML = steps.slice(stepIdx).map((st, i) => {
        const info = maneuverInfo(st);
        return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);${i===0?'opacity:1':'opacity:.55'}">
          <span style="font-size:18px">${info.icon}</span>
          <div style="flex:1;font-size:12px;color:#E7ECF2">${escapeHtml(info.text)}</div>
          <span style="font-size:10.5px;color:#8A97A8">${Math.round(st.distance)} م</span>
        </div>`;
      }).join("") || `<div style="text-align:center;padding:10px;color:#4ADE80;font-weight:800">🏁 وصلت — ${escapeHtml(destName)}</div>`;
    }
    function updateHud(distToNext) {
      const info = maneuverInfo(steps[stepIdx] || { maneuver: { type: "arrive" } });
      document.getElementById("navIcon").textContent = info.icon;
      document.getElementById("navInstruction").textContent = info.text;
      document.getElementById("navDistance").textContent = distToNext != null ? `بعد ${Math.round(distToNext)} م` : "";

    renderStepsPanel();
    updateHud(steps[0]?.distance);

    document.getElementById("navRecenterBtn").onclick = () => { followMode = true; };
    map.on("dragstart", () => { followMode = false; });

    let lastPos = null;
    let watchId = null;
    if (navigator.geolocation) {
      watchId = navigator.geolocation.watchPosition((pos) => {
        const cur = [pos.coords.latitude, pos.coords.longitude];
        const lngLat = [cur[1], cur[0]];
        if (!liveMarker) liveMarker = new maplibregl.Marker({ element: liveMarkerEl, rotationAlignment: "map" }).setLngLat(lngLat).addTo(map);
        else liveMarker.setLngLat(lngLat);

        const accEl = document.getElementById("navAccBadge");
        if (accEl) {
          const acc = Math.round(pos.coords.accuracy || 0);
          accEl.textContent = `🎯 دقة ${acc} م`;
          accEl.style.color = acc <= 8 ? "#4ADE80" : acc <= 20 ? "#2DD4BF" : "#F5A623";
        }

        if (followMode) map.easeTo({ center: lngLat, zoom: 18.5, pitch: 62, duration: 700 });

        if (typeof pos.coords.heading === "number" && !Number.isNaN(pos.coords.heading)) {
          applyHeading(pos.coords.heading);
        } else if (lastPos) {
          const toRad = (d) => d * Math.PI / 180, toDeg = (r) => r * 180 / Math.PI;
          const y = Math.sin(toRad(cur[1] - lastPos[1])) * Math.cos(toRad(cur[0]));
          const x = Math.cos(toRad(lastPos[0])) * Math.sin(toRad(cur[0])) - Math.sin(toRad(lastPos[0])) * Math.cos(toRad(cur[0])) * Math.cos(toRad(cur[1] - lastPos[1]));
          const brng = (toDeg(Math.atan2(y, x)) + 360) % 360;
          if (haversine(lastPos, cur) > 2) applyHeading(brng);
        }
        lastPos = cur;

        if (steps[stepIdx]) {
          const nextManeuverStep = steps[stepIdx + 1];
          const targetLoc = nextManeuverStep && nextManeuverStep.maneuver && nextManeuverStep.maneuver.location
            ? [nextManeuverStep.maneuver.location[1], nextManeuverStep.maneuver.location[0]]
            : routeCoords[routeCoords.length - 1];
          const d = haversine(cur, targetLoc);
          if (d < 20 && stepIdx < steps.length - 1) { stepIdx++; renderStepsPanel(); haptic(60); }
          updateHud(d);
        }
      }, () => { document.getElementById("navInstruction").textContent = "ما قدرنا نحدد موقعك — تأكد من صلاحية الموقع"; }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    }

    document.getElementById("navEndBtn").onclick = () => {
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      map.remove();
      renderDriverRouteScreen(row, pin);
    };

      const btn = document.getElementById("reqSubmitBtn");
      btn.disabled = true; btn.textContent = "...";
      const { error } = await sb.rpc("submit_leave_request", { p_member_id: row.member_id, p_pin: pin, p_type: type, p_date: date, p_note: note || null });
      btn.disabled = false; btn.textContent = "إرسال الطلب";
      if (error) { errEl.textContent = "صار خطأ، جرب مرة ثانية."; return; }
      document.getElementById("reqNote").value = "";
      document.getElementById("reqFormBox").style.display = "none";
      loadMyRequests();
    };

    const confirmBtn = document.getElementById("ciConfirmBtn");
    if (confirmBtn) confirmBtn.onclick = async () => {
      confirmBtn.disabled = true; confirmBtn.textContent = "...جارِ تحديد الموقع";
      const geo = await getGeo();
      if (!geo) {
        confirmBtn.disabled = false; confirmBtn.textContent = "📍 تأكيد الحضور الآن";
        document.getElementById("ciConfirmErr").textContent = "لازم تسمح بالوصول للموقع لتأكيد الحضور.";
        return;
      }
      const { data: resultGeo, error } = await sb.rpc("member_checkin", {
        p_member_id: row.member_id, p_pin: pin, p_lat: geo.lat, p_lng: geo.lng, p_accuracy: geo.accuracy
      });
      if (error) {
        confirmBtn.disabled = false; confirmBtn.textContent = "📍 تأكيد الحضور الآن";
        document.getElementById("ciConfirmErr").textContent = "صار خطأ، جرب مرة ثانية.";
        return;
      }
      row.today_status = "present";
      row.today_time_in = new Date().toTimeString().slice(0,5);
      row.today_in_range = resultGeo?.in_range;
      row.today_distance_m = resultGeo?.distance_m;
      haptic();
      showToast("✅ تم تأكيد حضورك بنجاح");
      renderCheckinInfo(row, pin);
    };

    document.getElementById("ciBackBtn").onclick = () => { clearCreds(); renderCheckinChoice(); };
    document.getElementById("mySettingsBtn").onclick = () => renderMemberSettings(row, pin);
    wirePwaInstallButton();
  }

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById("pwaInstallBtn");
    if (btn) btn.style.display = "block";
  });
  function wirePwaInstallButton() {
    const btn = document.getElementById("pwaInstallBtn");
    if (!btn) return;
    if (deferredInstallPrompt) btn.style.display = "block";
    btn.onclick = async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.style.display = "none";
    };
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        // لو في نسخة جديدة من sw.js صارت جاهزة، فعّلها فورًا
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              nw.postMessage("SKIP_WAITING");
            }
          });
        });
        if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
      }).catch(() => {});
      // لما تتفعّل نسخة جديدة، أعد تحميل الصفحة مرة وحدة فقط تلقائيًا
      let refreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshed) return;
        refreshed = true;
        location.reload();
      });
    });
  }

  function renderCommandSplash() {
    app.innerHTML = `
      <div class="cmdSplash" id="cmdSplash">
        ${SEAL_SVG.replace('class="seal"', 'class="splashSeal"')}
        <div class="splashTitle">🛡️ سجلّ الدوام</div>
        <div class="splashSub">...جارِ تجهيز لوحة القيادة</div>
        <div class="splashBar"></div>
      </div>`;
  }
  function fadeOutSplash() {
    return new Promise(resolve => {
      const el = document.getElementById("cmdSplash");
      if (!el) return resolve();
      el.classList.add("out");
      setTimeout(resolve, 350);
    });
  }

  const withTimeout = (promise, ms, label) => Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`انتهت مهلة الانتظار (${label || "اتصال"}) — تأكد من اتصالك بالإنترنت وجرب تقفل أي VPN شغّال وأعد المحاولة.`)), ms)),
  ]);

  (async () => {
    try {
      if (checkinMode) { await withTimeout(renderCheckinEntry(), 15000, "تسجيل الدخول"); return; }
      renderCommandSplash();
      const minWait = new Promise(resolve => setTimeout(resolve, 650));
      const [{ data: { session } }] = await withTimeout(Promise.all([sb.auth.getSession(), minWait]), 10000, "الجلسة");
      await fadeOutSplash();
      if (session) await withTimeout(bootApp(), 15000, "تحميل البيانات");
      else renderLogin();
    } catch (err) {
      showFatalErr(err.message || String(err));
    }
  })();

</script>
</body>
</html>
