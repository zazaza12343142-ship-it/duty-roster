<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجلّ الدوام — النظام الرسمي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230B1016' stroke='%232DD4BF' stroke-width='3'/%3E%3Cpath d='M32 14l4.8 10.3 11.2 1.4-8.2 7.9 2.1 11.4L32 39.8l-9.9 5.2 2.1-11.4-8.2-7.9 11.2-1.4z' fill='%232DD4BF'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0F16">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0A0F16; --surface:#131C27; --surface2:#182333; --border:#223247;
    --ink:#E7ECF2; --muted:#8A97A8; --dim:#5B6779;
    --accent:#2DD4BF; --accent-ink:#0A0F16;
    --danger:#D64545; --good:#2FAE60;
  }
  body.cmd-theme header { border-bottom-color:#123B37; }

  /* ---- Professional dashboard refresh ---- */
  .formCard, .unitCard, .shiftCard, .reqCard { box-shadow:0 10px 24px -16px #000000cc; transition:box-shadow .15s, border-color .15s; }
  .formCard:hover, .unitCard:hover { border-color:#2A3A54; }
  .kpiGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  @media (min-width:520px) { .kpiGrid { grid-template-columns:repeat(4,1fr); } }
  .kpiCard { position:relative; background:linear-gradient(160deg,#141F2E 0%,#101826 100%); border:1px solid #1E2B41; border-radius:14px; padding:14px 14px 12px; overflow:hidden; box-shadow:0 10px 24px -16px #000000cc; }
  .kpiCard::before { content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--kpi-color,var(--accent)); }
  .kpiIcon { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; background:color-mix(in srgb, var(--kpi-color,var(--accent)) 18%, transparent); margin-bottom:8px; }
  .kpiValue { font-size:24px; font-weight:900; font-family:'Cairo',sans-serif; line-height:1.1; color:var(--kpi-color,var(--ink)); }
  .kpiLabel { font-size:11.5px; color:var(--muted); margin-top:3px; }

  /* ---- Sidebar navigation ---- */
  .hamburgerBtn { background:none; border:1px solid #2A3547; color:var(--ink); border-radius:9px; width:38px; height:38px; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cmdSplash { position:fixed; inset:0; z-index:200; background:radial-gradient(circle at 50% 40%, #1A2438 0%, #0A0F16 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; opacity:1; transition:opacity .35s ease; }
  .cmdSplash.out { opacity:0; }
  .cmdSplash .splashSeal { width:88px; height:88px; animation:splashPulse 1.8s ease-in-out infinite; filter:drop-shadow(0 0 18px rgba(45,212,191,.5)); }
  @keyframes splashPulse { 0%,100% { transform:scale(1); opacity:.92; } 50% { transform:scale(1.06); opacity:1; } }
  .cmdSplash .splashTitle { font-family:'Cairo',sans-serif; font-weight:800; font-size:19px; color:#F0E6D2; letter-spacing:.5px; animation:splashFadeUp .6s ease both; }
  .cmdSplash .splashSub { font-size:12px; color:#8A97A8; animation:splashFadeUp .6s .1s ease both; }
  @keyframes splashFadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .cmdSplash .splashBar { width:130px; height:3px; border-radius:3px; background:#1E2B41; overflow:hidden; margin-top:4px; }
  .cmdSplash .splashBar::after { content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg,#2DD4BF,#4ADE80); border-radius:3px; animation:splashSlide 1.1s ease-in-out infinite; }
  @keyframes splashSlide { 0% { transform:translateX(-120%); } 100% { transform:translateX(360%); } }
  .sidebarBackdrop { position:fixed; inset:0; background:#000000a0; opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
  .sidebarBackdrop.open { opacity:1; pointer-events:auto; }
  .sidebarNav { position:fixed; top:0; bottom:0; right:0; width:min(78vw,290px); background:#0E1622; border-left:1px solid var(--border); z-index:50; transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:-14px 0 40px -20px #000c; }
  .sidebarNav.open { transform:translateX(0); }
  .sidebarHead { padding:18px 16px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sidebarBrand { font-weight:800; font-size:15px; font-family:'Cairo',sans-serif; }
  .sidebarClose { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .sidebarList { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:3px; }
  .sideTabBtn { display:flex; align-items:center; gap:10px; background:none; border:none; color:#B9C3D1; font-weight:700; font-size:14px; text-align:start; padding:11px 12px; border-radius:10px; cursor:pointer; border-inline-start:3px solid transparent; }
  .sideTabBtn.active { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--ink); border-inline-start-color:var(--accent); }
  .sidebarFoot { padding:12px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--dim); }
  .roleTag { display:inline-block; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px; margin-inline-start:8px; vertical-align:middle; }
  .roleTag.cmd { background:#0B2E2B; border:1px solid #2DD4BF; color:#2DD4BF; }
  .roleTag.member { background:#0B2E2B; border:1px solid #2DD4BF; color:#2DD4BF; }
  * { box-sizing: border-box; font-family:'Tajawal', 'Tahoma', sans-serif; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); background-image:radial-gradient(circle at 50% 0%, #101826 0%, var(--bg) 60%); }
  h1, h2, h3, .brand, .dutyUnit, button, .tabBtn, .unitTitle { font-family:'Cairo','Tajawal',sans-serif; }
  .mono { font-family:'JetBrains Mono', monospace; letter-spacing:0.5px; }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .35s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 24px; width:100%; max-width:360px; text-align:center; box-shadow:0 20px 40px -20px #000000aa; }
  .seal { width:56px; height:56px; margin:0 auto 12px; display:block; }
  .officialTag { font-size:10.5px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin:-10px 0 16px; font-family:'JetBrains Mono',monospace; }
  h1 { font-size:19px; margin:0 0 6px; font-weight:800; }
  p { color:var(--muted); font-size:13px; margin-bottom:20px; line-height:1.6; }
  input, select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--ink); border-radius:9px; padding:11px 12px; font-size:14px; margin-bottom:10px; transition:border-color .15s; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); border:none; color:var(--accent-ink); font-weight:800; border-radius:9px; padding:12px 16px; font-size:14px; cursor:pointer; transition:filter .15s, transform .1s; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.55; cursor:default; transform:none; }
  .err { color:var(--danger); font-size:12px; margin-top:8px; }
  .ghost { background:none; border:1px solid #3A4658; color:#C7D0DC; }
  header { position:sticky; top:0; background:#0A0F16ee; backdrop-filter:blur(8px); border-bottom:1px solid var(--border); z-index:10; }
  .headerTop { padding:14px 16px 0; display:flex; justify-content:space-between; align-items:center; }
  .brand { font-weight:800; font-size:16px; letter-spacing:.3px; }
  .tabs { display:flex; gap:16px; padding:10px 16px 0; }
  .tabBtn { background:none; border:none; color:var(--ink); font-weight:700; font-size:13.5px; padding:8px 2px 10px; cursor:pointer; border-bottom:2px solid transparent; opacity:.5; transition:opacity .15s; }
  .tabBtn.active { opacity:1; border-bottom-color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .rosterGrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:14px; }
  .unitCard { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:16px; }
  .unitTitle { font-weight:800; font-size:17px; margin-bottom:4px; background:transparent; border:none; border-bottom:2px solid #2A3547; color:#E7ECF2; width:100%; padding:4px 2px; }
  .memberRow { background:#0F1720; border:1px solid #1E2B41; border-radius:10px; padding:8px; margin-bottom:8px; }
  .memberRowTop { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13.5px; font-weight:700; }
  .pinTag { font-size:11px; color:#8A97A8; background:#141F2E; border-radius:6px; padding:3px 7px; cursor:pointer; }
  .addRow { display:flex; gap:6px; margin-top:10px; }
  .addRow input { margin-bottom:0; flex:1; }
  .xbtn { background:none; border:none; color:#5B6779; cursor:pointer; font-size:14px; padding:2px 6px; }
  .empty { color:#5B6779; font-size:13px; padding:10px 0; text-align:center; background:#141F2E; border:1px dashed #2A3547; border-radius:10px; }
  .loading { color:#8A97A8; text-align:center; padding:40px; }
  .dateBar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .dateMain { font-weight:800; font-size:15px; }
  .iconbtn { background:#172236; border:1px solid #2A3547; color:#E7ECF2; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:16px; }
  .linkbtn { background:none; border:none; color:#2DD4BF; font-size:12px; cursor:pointer; text-decoration:underline; }
  .dutyBanner { display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg,#08211E,#0F1720); border:1px solid #134E4A; border-radius:12px; padding:12px 16px; margin-bottom:14px; }
  .dutyLabel { font-size:12px; color:#5EEAD4; }
  .dutyUnit { font-weight:800; font-size:17px; color:#4ADE80; }
  .shiftGrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:12px; }
  .shiftCard { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:12px; }
  .shiftHeader { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2A3547; padding-bottom:8px; margin-bottom:10px; font-weight:800; }
  .pillsRow { display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; }
  .pill { border:1.5px solid; border-radius:8px; padding:5px 8px; cursor:pointer; font-size:12px; background:transparent; font-weight:700; }
  .pill.active { color:#0F1720; }
  .assignChip { background:#1E2B41; border:1px dashed #3A4658; color:#C7D0DC; border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; margin:3px; }
  .verifyBox { display:flex; align-items:center; gap:6px; background:#06201D; border:1px solid #134E4A; border-radius:8px; padding:6px 8px; margin-top:6px; }
  .verifyBox input { width:70px; margin:0; padding:5px 6px; font-size:13px; letter-spacing:2px; }
  .miniBtn { background:#2DD4BF; border:none; color:#0F1720; font-weight:800; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .miniBtnGhost { background:none; border:1px solid #3A4658; color:#C7D0DC; border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .timeRow { display:flex; align-items:center; gap:6px; margin-top:8px; border-top:1px dashed #2A3547; padding-top:6px; font-size:12px; color:#8A97A8; }
  .timeRow input[type=time] { width:auto; margin:0; padding:3px 6px; font-size:12px; }
  .geoLink { font-size:11px; color:#3B82C4; display:block; margin-top:4px; }
  .geoNote { font-size:11px; color:#5B6779; margin-top:4px; }
  .formCard { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:16px; margin-bottom:16px; }
  .formRow { display:flex; gap:8px; flex-wrap:wrap; }
  .formRow > * { flex:1; min-width:140px; }
  .reqCard { background:#141F2E; border:1px solid #1E2B41; border-radius:12px; padding:14px; margin-bottom:8px; }
  .reqTop { display:flex; justify-content:space-between; align-items:flex-start; }
  .reqBottom { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .badge { font-size:12px; border-radius:20px; padding:3px 10px; border:1px solid; }
  .approveBtn { background:#0F2A1B; border:1px solid #2FAE60; color:#2FAE60; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:700; }
  .rejectBtn { background:#2A1414; border:1px solid #D64545; color:#D64545; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:700; }
  .platoonCard { background:#101A28; border:1px solid #24334A; border-radius:12px; padding:12px; margin-top:12px; }
  .platoonHead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .platoonHead input.unitTitle { font-size:15px; border-bottom:2px solid #24334A; }
  .cmdRow { display:flex; align-items:center; gap:6px; font-size:12px; color:#8A97A8; margin-bottom:10px; }
  .cmdRow select { margin:0; padding:5px 6px; font-size:12px; flex:1; }
  .squadCard { background:#0F1720; border:1px solid #1E2B41; border-radius:10px; padding:10px; margin-top:8px; }
  .squadHead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .squadHead input.unitTitle { font-size:13.5px; border-bottom:2px solid #1E2B41; }
  .smallMember { display:flex; justify-content:space-between; align-items:center; background:#141F2E; border-radius:8px; padding:6px 8px; margin-bottom:5px; font-size:12.5px; }
  .unassignedBox { border:1px dashed #3A4658; border-radius:10px; padding:10px; margin-top:12px; }
  .smallBtn { background:#1E2B41; border:1px dashed #3A4658; color:#C7D0DC; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; margin:2px; }
  .rosterTable { width:100%; border-collapse:collapse; font-size:12.5px; }
  .rosterTable th, .rosterTable td { border-bottom:1px solid #1E2B41; padding:9px 7px; text-align:right; white-space:nowrap; }
  .rosterTable th { color:#8A97A8; font-weight:700; font-size:11.5px; }
  .rosterTable tbody tr:hover { background:#141F2E; }
  .rosterFilters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .rosterFilters select { flex:1; min-width:110px; margin:0; }
  .pagerRow { display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:12px; color:#8A97A8; }
  .planBox { background:#141F2E; border:1px solid #1E2B41; border-radius:14px; padding:14px; margin-bottom:14px; }
  .planRow { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed #1E2B41; }
  .planRow:last-child { border-bottom:none; }
  .planRow select { margin:0; padding:6px 8px; font-size:12.5px; width:auto; min-width:130px; }
  .leftoverBox { border:1px dashed #3A4658; border-radius:10px; padding:10px; margin-top:12px; }

  /* ---- Glass auth screen (individual entry / login) ---- */
  .authScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background-image:linear-gradient(180deg, rgba(4,8,14,.55), rgba(4,8,14,.8)), url('bg-shield.jpg'); background-size:cover; background-position:center; }
  .glassCard { width:100%; max-width:380px; background:rgba(20,32,50,0.42); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.18); border-radius:22px; padding:34px 26px; box-shadow:0 25px 60px -18px rgba(0,0,0,0.65); text-align:center; }
  .glassCard .seal { filter:drop-shadow(0 0 10px rgba(45,212,191,.4)); }
  .glassCard h1 { color:#fff; font-size:21px; margin:0 0 6px; font-weight:800; }
  .glassCard .officialTag { color:rgba(255,255,255,.6); }
  .glassCard p { color:rgba(255,255,255,.75); }
  .glassField { text-align:right; margin-bottom:20px; }
  .glassField label { display:block; font-size:11.5px; color:rgba(255,255,255,.72); margin-bottom:7px; }
  .glassField .inputWrap { position:relative; }
  .glassField input { width:100%; background:transparent; border:none; border-bottom:1.5px solid rgba(255,255,255,.38); color:#fff; padding:5px 24px 9px 2px; font-size:14.5px; border-radius:0; margin-bottom:0; }
  .glassField input::placeholder { color:rgba(255,255,255,.4); }
  .glassField input:focus { border-bottom-color:#2DD4BF; outline:none; }
  .glassField .fIcon { position:absolute; right:2px; top:4px; color:rgba(255,255,255,.55); font-size:14px; pointer-events:none; }
  .glassHint { font-size:11.5px; color:rgba(255,255,255,.62); text-align:center; margin:2px 0 20px; }
  .glassBtn { width:100%; background:#fff; color:#0A0F16; border:none; border-radius:24px; padding:13px; font-weight:800; font-size:14.5px; cursor:pointer; }
  .glassBtn:hover { filter:brightness(.96); }
  .glassBtnGhost { width:100%; background:rgba(255,255,255,.08); color:#fff; border:1.5px solid rgba(255,255,255,.4); border-radius:24px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; }
  .glassBottom { margin-top:18px; font-size:12.5px; color:rgba(255,255,255,.75); }
  .glassBottom b { color:#fff; cursor:pointer; text-decoration:underline; }
  .glassErr { color:#FF9B9B; font-size:12px; margin-top:6px; min-height:14px; }

  /* ============================================================
     Futuristic Dark Glass theme — applied across the whole app
     (frosted panels, teal glow, ambient smoky backdrop)
     ============================================================ */
  body {
    background-color:#0A0F16;
    background-image:
      radial-gradient(circle at 15% -10%, rgba(45,212,191,.10) 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(74,222,128,.06) 0%, transparent 40%),
      radial-gradient(circle at 50% 0%, #101826 0%, #0A0F16 65%);
    background-attachment:fixed;
  }
  header, .card, .kpiCard, .unitCard, .shiftCard, .memberRow, .formCard, .reqCard,
  .platoonCard, .squadCard, .smallMember, .planBox, .dutyBanner, .sidebarNav,
  .rosterTable, .empty {
    background-color:rgba(19,28,42,.55) !important;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-color:rgba(45,212,191,.16) !important;
  }
  .kpiCard, .unitCard, .shiftCard, .card, .formCard, .reqCard, .platoonCard, .squadCard, .dutyBanner {
    box-shadow:0 18px 40px -22px #000000cc, 0 0 0 1px rgba(45,212,191,.05) inset;
  }
  .kpiCard:hover, .unitCard:hover, .formCard:hover, .shiftCard:hover {
    border-color:rgba(45,212,191,.4) !important;
    box-shadow:0 18px 40px -18px #000000cc, 0 0 22px -6px rgba(45,212,191,.35);
  }
  .kpiCard::before { box-shadow:0 0 10px 1px var(--kpi-color,var(--accent)); }
  header { background:rgba(10,15,22,.72) !important; }
  .sidebarNav { background:rgba(14,22,34,.72) !important; border-inline-start:1px solid rgba(45,212,191,.16); }
  .roleTag.cmd, .roleTag.member { background:rgba(11,46,43,.55); border-color:#2DD4BF; color:#2DD4BF; }
  button:not(.ghost):not(.smallBtn):not(.xbtn):not(.linkbtn):not(.sideTabBtn):not(.iconbtn):not(.hamburgerBtn):not(.sidebarClose):not(.tabBtn):not(.approveBtn):not(.rejectBtn):not(.miniBtn):not(.glassBtn):not(.glassBtnGhost):not(.pinTag) {
    background:linear-gradient(135deg,#2DD4BF,#4ADE80);
    box-shadow:0 6px 18px -6px rgba(45,212,191,.55);
  }
  button:not(.ghost):not(.smallBtn):not(.xbtn):not(.linkbtn):not(.sideTabBtn):not(.iconbtn):not(.hamburgerBtn):not(.sidebarClose):not(.tabBtn):not(.approveBtn):not(.rejectBtn):not(.miniBtn):not(.glassBtn):not(.glassBtnGhost):not(.pinTag):hover {
    box-shadow:0 8px 22px -6px rgba(45,212,191,.75);
  }

  /* ---- Sidebar nav: true glass, high legibility (fixes over-bright solid blocks) ---- */
  .sidebarNav { background:rgba(11,17,26,.82) !important; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .sideTabBtn { background:rgba(255,255,255,.03); border:1px solid transparent; }
  .sideTabBtn span { color:#E7ECF2; }
  .sideTabBtn.active {
    background:rgba(45,212,191,.10) !important;
    border-color:rgba(45,212,191,.35);
    color:#fff;
  }

  function urlBase64ToUint8Array(base64String) {

    const rawData = atob(base64);

    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);

  function haversineDistanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function parseImportFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          resolve(rows);
        } catch (err) { reject(err); }
      };
      reader.onerror = () => reject(new Error("تعذّرت قراءة الملف"));
      reader.readAsArrayBuffer(file);
    });
  }

  function resolveImportRows(rawRows) {
    if (!rawRows.length) return [];
    const sampleKeys = Object.keys(rawRows[0]);
    const nameKey = sampleKeys.find(k => k.includes("اسم"));
    const unitKey = sampleKeys.find(k => k.includes("سرية"));
    const platoonKey = sampleKeys.find(k => k.includes("فصيلة"));
    const squadKey = sampleKeys.find(k => k.includes("مجموعة"));
    const seenInFile = new Set();

    return rawRows.map((row, idx) => {
      const name = nameKey ? String(row[nameKey] || "").trim() : "";
      const unitName = unitKey ? String(row[unitKey] || "").trim() : "";
      const platoonName = platoonKey ? String(row[platoonKey] || "").trim() : "";
      const squadName = squadKey ? String(row[squadKey] || "").trim() : "";
      const result = { rowNum: idx + 2, name, unitName, platoonName, squadName, status: "", reason: "", unit_id: null, squad_id: null, existingMemberId: null };

      if (!name) { result.status = "error"; result.reason = "بدون اسم"; return result; }
      if (!nameKey) { result.status = "error"; result.reason = "ما لقيت عمود «الاسم» بالملف"; return result; }
      if (seenInFile.has(name)) { result.status = "error"; result.reason = "الاسم مكرر أكثر من مرة بنفس الملف"; return result; }
      seenInFile.add(name);

      if (!unitName) { result.status = "error"; result.reason = "بدون سرية"; return result; }
      const unit = UNITS.find(u => u.name.trim() === unitName);
      if (!unit) { result.status = "error"; result.reason = `السرية «${unitName}» غير موجودة`; return result; }
      result.unit_id = unit.id;

      let platoon = null;
      if (platoonName) {
        platoon = PLATOONS.find(p => p.unit_id === unit.id && p.name.trim() === platoonName);
        if (!platoon) { result.status = "error"; result.reason = `الفصيلة «${platoonName}» غير موجودة بسرية «${unitName}»`; return result; }
      }
      if (squadName) {
        if (!platoon) { result.status = "error"; result.reason = "المجموعة محددة بدون فصيلة"; return result; }
        const squad = SQUADS.find(s => s.platoon_id === platoon.id && s.name.trim() === squadName);
        if (!squad) { result.status = "error"; result.reason = `المجموعة «${squadName}» غير موجودة بفصيلة «${platoonName}»`; return result; }
        result.squad_id = squad.id;
      }

      const matches = MEMBERS.filter(m => m.name.trim() === name);
      if (matches.length > 1) { result.status = "error"; result.reason = "الاسم مكرر بعدة أفراد موجودين مسبقًا — راجعيه يدويًا"; return result; }
      if (matches.length === 1) { result.status = "update"; result.existingMemberId = matches[0].id; }
      else { result.status = "new"; }
      return result;
    });
  }

  async function executeImport(rows) {
    const usedPins = new Set(MEMBERS.map(m => m.pin));
    const toInsert = rows.filter(r => r.status === "new").map(r => ({ unit_id: r.unit_id, squad_id: r.squad_id, name: r.name, pin: genUniquePin(usedPins) }));
    const toUpdate = rows.filter(r => r.status === "update").map(r => ({ id: r.existingMemberId, unit_id: r.unit_id, squad_id: r.squad_id, name: r.name }));

    let insertError = null, updateError = null;
    if (toInsert.length) {
      const { error } = await sb.from("members").insert(toInsert);
      insertError = error;
    }
    if (toUpdate.length && !insertError) {
      const { error } = await sb.from("members").upsert(toUpdate, { onConflict: "id" });
      updateError = error;
    }
    return {
      insertError, updateError,
      insertedCount: insertError ? 0 : toInsert.length,
      updatedCount: updateError ? 0 : toUpdate.length,
    };
  }

  function getFilteredRosterMembers() {
    let list = MEMBERS.slice();
    if (rosterFilterUnit) list = list.filter(m => m.unit_id === rosterFilterUnit);
    if (rosterFilterSquad) {
      list = list.filter(m => m.squad_id === rosterFilterSquad);
    } else if (rosterFilterPlatoon) {
      const squadIds = new Set(SQUADS.filter(s => s.platoon_id === rosterFilterPlatoon).map(s => s.id));
      list = list.filter(m => squadIds.has(m.squad_id));
    }
    if (rosterFilterText.trim()) {
      const q = rosterFilterText.trim();
      list = list.filter(m => m.name.includes(q));
    }
    return list.slice().sort((a, b) => a.name.localeCompare(b.name, "ar"));
  }

  const dayShortAr = (iso) => ["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"][new Date(iso+"T00:00:00").getDay()];
  function getSundayWeekStart(dateISO) {
    const d = new Date(dateISO + "T00:00:00");
    d.setDate(d.getDate() - d.getDay());
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  async function exportWeeklyExcelReport(weekStartISO) {
    const weekEndISO = addDays(weekStartISO, 6);
    const records = await loadAttendanceRange(weekStartISO, weekEndISO);
    const byDateMember = {};
    records.forEach(r => { (byDateMember[r.date] ||= {})[r.member_id] = r.status; });

    const days = Array.from({length:7}, (_, i) => addDays(weekStartISO, i));
    const header = ["الاسم", "السرية", "الفصيلة", "المجموعة", ...days.map(d => `${dayShortAr(d)} ${d.slice(5)}`), "أيام الحضور", "أيام الغياب", "نسبة الحضور %"];

    const rows = MEMBERS.map(m => {
      const unit = UNITS.find(u => u.id === m.unit_id);
      const squad = SQUADS.find(s => s.id === m.squad_id);
      const platoon = squad ? PLATOONS.find(p => p.id === squad.platoon_id) : null;
      let presentCount = 0, absentCount = 0;
      const dayCells = days.map(d => {
        const st = byDateMember[d]?.[m.id];
        if (st === "present") { presentCount++; return "حاضر"; }
        if (st === "absent") { absentCount++; return "غايب"; }
        if (st && REQUEST_TYPES.includes(st)) return STATUS[st].label;
        return "—";
      });
      const pct = Math.round((presentCount/7)*100);
      return [m.name, unit?.name||"", platoon?.name||"", squad?.name||"", ...dayCells, presentCount, absentCount, pct];
    });

    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws["!cols"] = [{wch:20},{wch:12},{wch:14},{wch:14}, ...days.map(()=>({wch:10})), {wch:12},{wch:12},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "التقرير الأسبوعي");
    XLSX.writeFile(wb, `تقرير-الحضور-${weekStartISO}.xlsx`);
  }

  async function printProfessionalWeeklyReport(weekStartISO) {
    const weekEndISO = addDays(weekStartISO, 6);
    const records = await loadAttendanceRange(weekStartISO, weekEndISO);
    const byDateMember = {};
    records.forEach(r => { (byDateMember[r.date] ||= {})[r.member_id] = r.status; });
    const days = Array.from({ length: 7 }, (_, i) => addDays(weekStartISO, i));

    let totalPresentAll = 0, totalAbsentAll = 0, totalReqAll = 0;
    const unitBlocks = UNITS.map(unit => {
      const unitMembers = MEMBERS.filter(m => m.unit_id === unit.id);
      const rows = unitMembers.map((m, i) => {
        const squad = SQUADS.find(s => s.id === m.squad_id);
        const platoon = squad ? PLATOONS.find(p => p.id === squad.platoon_id) : null;
        let presentCount = 0, absentCount = 0, reqCount = 0;
        const dayCells = days.map(d => {
          const st = byDateMember[d]?.[m.id];
          if (st === "present") { presentCount++; return `<td class="ok">حاضر</td>`; }
          if (st === "absent") { absentCount++; return `<td class="bad">غايب</td>`; }
          if (st && REQUEST_TYPES.includes(st)) { reqCount++; return `<td class="req">${escapeHtml(STATUS[st].label)}</td>`; }
          return `<td class="empty">—</td>`;
        }).join("");
        totalPresentAll += presentCount; totalAbsentAll += absentCount; totalReqAll += reqCount;
        const pct = Math.round((presentCount / 7) * 100);
        return `<tr>
          <td>${i + 1}</td>
          <td class="nameCell">${escapeHtml(m.name)}</td>
          <td>${escapeHtml(platoon?.name || "—")}</td>
          <td>${escapeHtml(squad?.name || "—")}</td>
          ${dayCells}
          <td class="pctCell" style="color:${pct >= 80 ? '#1a7a3a' : pct >= 50 ? '#0F766E' : '#b3261e'}">${pct}%</td>
        </tr>`;
      }).join("");
      return `
        <div class="unitSection">
          <div class="unitTitle">🏢 ${escapeHtml(unit.name)} <span class="unitCount">(${unitMembers.length} فرد)</span></div>
          <table>
            <thead><tr>
              <th>#</th><th>الاسم</th><th>الفصيلة</th><th>المجموعة</th>
              ${days.map(d => `<th>${dayShortAr(d)}<br><span class="dnum">${d.slice(5)}</span></th>`).join("")}
              <th>نسبة الحضور</th>
            </tr></thead>
            <tbody>${rows || `<tr><td colspan="12" style="text-align:center;color:#999;padding:14px">لا يوجد أفراد بهاي السرية</td></tr>`}</tbody>
          </table>
        </div>`;
    }).join("");

    const totalMembersCount = MEMBERS.length || 1;
    const overallPct = Math.round((totalPresentAll / (totalMembersCount * 7)) * 100) || 0;
    const genDate = new Date().toLocaleString("ar-EG");

      resultsBox.innerHTML = matches.map(m => `<div class="smallMember" data-pickviolmember="${m.id}" style="cursor:pointer"><span>${escapeHtml(m.name)}</span></div>`).join("") || `<div style="font-size:12px;color:#8A97A8">ما في نتائج</div>`;

  async function exportFullBackupExcel() {
    const memberName = (id) => MEMBERS.find(m => m.id === id)?.name || "—";

    // 1. الأفراد
    const membersRows = MEMBERS.map(m => {
      const unit = UNITS.find(u => u.id === m.unit_id);
      const squad = SQUADS.find(s => s.id === m.squad_id);
      const platoon = squad ? PLATOONS.find(p => p.id === squad.platoon_id) : null;
      return {
        "الاسم": m.name,
        "السرية": unit?.name || "",
        "الفصيلة": platoon?.name || "—",
        "المجموعة": squad?.name || "—",
        "الرمز السري": m.pin,
        "تاريخ الإضافة": m.created_at ? String(m.created_at).slice(0,10) : "",
      };

    // 7. الإعدادات
    const settingsRows = [
      { "الإعداد": "دورة المناوبة (rotation)", "القيمة": ROTATION ? JSON.stringify(ROTATION) : "" },

    XLSX.writeFile(wb, `نسخة-احتياطية-كاملة-${stamp}.xlsx`);
  }

  async function printTodayDutyRoster() {
    const dateISO = todayISO();
    const records = await loadAttendance(dateISO);
    const recByMember = {};
    records.forEach(r => recByMember[r.member_id] = r);
    const onDutyUnitId = getOnDutyUnitId(UNITS, ROTATION, dateISO);
    const onDutyUnit = UNITS.find(u => u.id === onDutyUnitId) || UNITS[0];
    const weekStart = getWeekStart(dateISO, ROTATION);
    const planRows = await loadShiftPlan(weekStart);
    const onDutyPlatoons = PLATOONS.filter(p => p.unit_id === onDutyUnitId);

    function membersOfPlatoon(platoonId) {
      const squadIds = SQUADS.filter(s => s.platoon_id === platoonId).map(s => s.id);
      return MEMBERS.filter(m => squadIds.includes(m.squad_id));
    }

    const shiftSections = SHIFTS.map(shift => {
      const platoonIds = planRows.filter(r => r.shift === shift.id && onDutyPlatoons.some(p => p.id === r.platoon_id)).map(r => r.platoon_id);
      const platoonNames = platoonIds.map(pid => onDutyPlatoons.find(p => p.id === pid)?.name).filter(Boolean);
      const mems = platoonIds.flatMap(pid => membersOfPlatoon(pid));
      return { shift, platoonNames, members: mems };
    });

    const coveredIds = new Set(shiftSections.flatMap(s => s.members.map(m => m.id)));
    const allUnitMembers = MEMBERS.filter(m => m.unit_id === onDutyUnitId);
    const leftover = allUnitMembers.filter(m => !coveredIds.has(m.id));

    const rowsHtml = (mems) => mems.length === 0

        const st = recByMember[m.id]?.status;
        if (st === "present") present++;
        else if (st === "absent") absent++;
        else if (REQUEST_TYPES.includes(st)) leave++;
        else { pending++; pendingMembers.push(m.name); }

      totalCovered += mems.length; totalPresent += present; totalLeave += leave; totalAbsent += absent; totalPending += pending;
      return { name: p.name, planned, total: mems.length, present, leave, absent, pending };

      sendEmergencyBtn.disabled = true; sendEmergencyBtn.textContent = "...جارِ الإرسال";
      try {
        await setEmergencyBroadcast(msg);
        statusEl.style.color = "#2FAE60";

        renderDashboard();
        sb.auth.getSession().then(({ data: { session } }) => {

          fetch(`${SUPABASE_URL}/functions/v1/send-emergency-push`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.access_token}` },

  // ---------- Duty ----------
  async function loadAttendance(dateISO) {
    const { data } = await sb.from("attendance").select("*").eq("date", dateISO);
    return data || [];
  }
  async function loadAttendanceRange(startISO, endISO) {
    const { data } = await sb.from("attendance").select("*").gte("date", startISO).lte("date", endISO);
    return data || [];
  }
  async function upsertAttendance(memberId, dateISO, patch) {
    const { data: existing } = await sb.from("attendance").select("*").eq("member_id", memberId).eq("date", dateISO).maybeSingle();
    if (existing) {
      await sb.from("attendance").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", existing.id);
    } else {
      await sb.from("attendance").insert({ member_id: memberId, date: dateISO, ...patch });
    }
  }

  async function renderDuty() {
    const main = document.getElementById("main");
    main.innerHTML = `<div class="loading">...جارِ التحميل</div>`;
    const records = await loadAttendance(currentDate);
    const onDutyUnitId = getOnDutyUnitId(UNITS, ROTATION, currentDate);
    const onDutyUnit = UNITS.find(u => u.id === onDutyUnitId) || UNITS[0];
    const offDutyUnit = UNITS.find(u => u.id !== onDutyUnitId) || UNITS[1];
    const weekStart = getWeekStart(currentDate, ROTATION);
    const planRows = await loadShiftPlan(weekStart);
    const onDutyPlatoons = PLATOONS.filter(p => p.unit_id === onDutyUnitId);
    const recByMember = {};
    records.forEach(r => recByMember[r.member_id] = r);
    const now = new Date();
    const isToday = currentDate === todayISO();

    function membersOfPlatoon(platoonId) {
      const squadIds = SQUADS.filter(s => s.platoon_id === platoonId).map(s => s.id);
      return MEMBERS.filter(m => squadIds.includes(m.squad_id));
    }

    const coveredMemberIds = new Set();
    const shiftMembersMap = {};
    SHIFTS.forEach(shift => {
      const platoonIds = planRows.filter(r => r.shift === shift.id && onDutyPlatoons.some(p => p.id === r.platoon_id)).map(r => r.platoon_id);
      const mems = platoonIds.flatMap(pid => membersOfPlatoon(pid));
      shiftMembersMap[shift.id] = mems;
      mems.forEach(m => coveredMemberIds.add(m.id));

    const allUnitMembers = MEMBERS.filter(m => m.unit_id === onDutyUnitId);
    const leftover = allUnitMembers.filter(m => !coveredMemberIds.has(m.id));

    main.innerHTML = `
      <div class="dateBar">
        <button class="iconbtn" data-prevday>›</button>
        <div style="text-align:center">

        <div><div class="dutyLabel">السرية المناوبة هذا الأسبوع</div><div class="dutyUnit">${escapeHtml(onDutyUnit?.name||"")}</div></div>
        <div style="text-align:left"><div style="font-size:12px;color:#8A97A8">مستريحة</div><div style="font-size:13px;color:#8A97A8">${escapeHtml(offDutyUnit?.name||"")}</div></div>
      </div>

      <div class="formCard" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">

          <div style="font-weight:800;font-size:13px">📍 موقع القاعدة</div>
          <div style="font-size:12px;color:#8A97A8">${BASE_LOCATION ? `نطاق القبول: ${BASE_LOCATION.radius} متر — التحقق من الموقع مفعّل` : "ما تحدد بعد — التحقق من الموقع غير مفعّل حاليًا"}</div>
        </div>
        <button class="smallBtn" id="setBaseLocBtn">${BASE_LOCATION ? "تعديل الموقع" : "تحديد من الخريطة"}</button>
      </div>

      <div class="planBox">
        <div style="font-weight:800;margin-bottom:8px">🗓️ خطة نوبات الأسبوع (من ${monthNameAr(weekStart)})</div>
        <div style="font-size:12px;color:#8A97A8;margin-bottom:10px">حدد أي فصيلة تاخد أي نوبة — بينطبق تلقائيًا على كل أيام هالأسبوع لهاي السرية.</div>
        ${onDutyPlatoons.length === 0 ? `<div class="empty">ما عندك فصائل بـ${escapeHtml(onDutyUnit?.name||"")} بعد — أضفها من تبويب «الطاقم».</div>` : onDutyPlatoons.map(p => {
          const current = planRows.find(r => r.platoon_id === p.id)?.shift || "";
          return `
            <div class="planRow">
              <span>${escapeHtml(p.name)}</span>
              <select data-planshift="${p.id}">
                <option value="">— بدون نوبة (راحة) —</option>
                ${SHIFTS.map(s => `<option value="${s.id}" ${current===s.id?"selected":""}>${s.label} (${s.range})</option>`).join("")}
              </select>
            </div>

        }).join("")}
      </div>

      ${allUnitMembers.length === 0 ? `<div class="empty">لا يوجد أفراد بـ${escapeHtml(onDutyUnit?.name||"")} بعد — أضفهم من تبويب «الطاقم».</div>` : ""}
      <div class="shiftGrid">
        ${SHIFTS.map(shift => {
          const shiftMembers = shiftMembersMap[shift.id];
          const platoonNames = planRows.filter(r => r.shift===shift.id && onDutyPlatoons.some(p=>p.id===r.platoon_id)).map(r => onDutyPlatoons.find(p=>p.id===r.platoon_id)?.name).filter(Boolean);

              <div class="shiftHeader" style="color:${shift.color}"><span>${shift.label}</span><span style="font-size:12px;color:#8A97A8">${shift.range}</span></div>

  function renderMemberRow(member, rec, shift, now, isToday) {
    const status = rec?.status;
    let progressHtml = "";
    if (status === "present" && rec?.time_in && isToday) {
      const [h,m] = rec.time_in.split(":").map(Number);
      const start = new Date(now); start.setHours(h,m,0,0);
      const elapsed = now - start; const total = 8*3600*1000;
      const pct = Math.max(0, Math.min(1, elapsed/total));
      const done = elapsed >= total;
      const doneAt = new Date(start.getTime()+total);
      progressHtml = `
        <div style="margin-top:6px">
          <div style="height:6px;background:#1E2B41;border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct*100}%;background:${done?'#2FAE60':shift.color}"></div>
          </div>
          <div style="font-size:11px;color:${done?'#2FAE60':'#8A97A8'};margin-top:3px">
            ${done ? "أنهى النوبة ✅ (٨ ساعات)" : `قيد النوبة — تنتهي حوالي ${pad(doneAt.getHours())}:${pad(doneAt.getMinutes())}`}
          </div>
        </div>`;
    }
    let geoHtml = "";
    if (status === "present" && rec?.geo) {
      const g = rec.geo;
      let rangeHtml = "";
      if (typeof g.in_range === "boolean") {
        rangeHtml = g.in_range
          ? `<div style="font-size:11px;color:#2FAE60;margin-top:2px">✔ داخل نطاق القاعدة</div>`
          : `<div style="font-size:11px;color:#D64545;margin-top:2px">⚠️ خارج نطاق القاعدة (تقريبًا <span class="mono">${g.distance_m}</span> م)</div>`;
      }
      geoHtml = `<a class="geoLink" href="https://www.google.com/maps?q=${g.lat},${g.lng}" target="_blank">📍 موقع الحضور على الخريطة (دقة ~${g.accuracy} م)</a>${rangeHtml}`;
    } else if (status === "present" && rec?.verified) {
      geoHtml = `<div class="geoNote">لم يتم تحديد الموقع (رفض الإذن أو غير متاح)</div>`;
    }
    return `
      <div class="memberRow" id="row-${member.id}">
        <div class="memberRowTop">
          <span>${escapeHtml(member.name)}</span>
        </div>
        <div class="pillsRow">
          <button class="pill ${status==='present'?'active':''}" data-status="present" data-memberid="${member.id}" style="border-color:${STATUS.present.color};color:${status==='present'?'#0F1720':STATUS.present.color};${status==='present'?`background:${STATUS.present.color}`:''}">حاضر</button>
          ${Object.entries(STATUS).filter(([k])=>k!=='present').map(([k,s]) => `
            <button class="pill ${status===k?'active':''}" data-status="${k}" data-memberid="${member.id}" style="border-color:${s.color};color:${status===k?'#0F1720':s.color};${status===k?`background:${s.color}`:''}">${s.label}</button>
          `).join("")}
        </div>
        <div id="verifyHolder-${member.id}"></div>
        ${status === "present" ? `
          <div class="timeRow">
            🕐 وقت الحضور
            <input type="time" value="${rec.time_in||''}" data-timein="${member.id}" />
            ${rec.verified ? `<span style="color:#2FAE60">✔ مؤكد بالرمز</span>` : ""}
          </div>
          ${geoHtml}
          ${progressHtml}
        ` : ""}
      </div>
    `;
  }

  function openVerify(memberId) {
    const holder = document.getElementById(`verifyHolder-${memberId}`);
    if (!holder) return;
    holder.innerHTML = `
      <div class="verifyBox">
        🔑
        <input type="password" inputmode="numeric" placeholder="رمز الفرد" id="pinInput-${memberId}" />
        <button class="miniBtn" id="pinConfirm-${memberId}">تأكيد</button>
        <button class="miniBtnGhost" id="pinCancel-${memberId}">إلغاء</button>
      </div>
    `;
    document.getElementById(`pinCancel-${memberId}`).onclick = () => { holder.innerHTML = ""; };
    document.getElementById(`pinConfirm-${memberId}`).onclick = async () => {
      const val = document.getElementById(`pinInput-${memberId}`).value;
      const member = MEMBERS.find(m => m.id === memberId);
      if (val !== member.pin) {
        document.getElementById(`pinInput-${memberId}`).style.borderColor = "#D64545";
        return;
      }
      const btn = document.getElementById(`pinConfirm-${memberId}`);
      btn.disabled = true; btn.textContent = "...جارِ تحديد الموقع";
      const geo = await getGeo();
      if (geo && BASE_LOCATION) {
        const dist = haversineDistanceMeters(geo.lat, geo.lng, BASE_LOCATION.lat, BASE_LOCATION.lng);
        geo.distance_m = Math.round(dist);
        geo.in_range = dist <= BASE_LOCATION.radius;
      }
      const now = new Date();
      const hh = pad(now.getHours()), mm = pad(now.getMinutes());
      await upsertAttendance(memberId, currentDate, { status:"present", verified:true, geo, time_in: hh+":"+mm });
      renderDuty();
    };
  }

  function openBaseLocationPicker() {
    const overlay = document.createElement("div");
    overlay.id = "mapModalOverlay";
    overlay.style.cssText = "position:fixed;inset:0;background:#000000cc;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px";
    overlay.innerHTML = `
      <div style="background:#141F2E;border:1px solid #1E2B41;border-radius:14px;padding:16px;max-width:480px;width:100%">
        <div style="font-weight:800;margin-bottom:8px">📍 حدد موقع القاعدة</div>
        <div style="font-size:12px;color:#8A97A8;margin-bottom:8px">دوس عالخريطة لتحديد نقطة القاعدة، أو استخدم موقعك الحالي إذا واقف فيها</div>
        <div id="pickerMap" style="height:280px;border-radius:10px;overflow:hidden;margin-bottom:10px"></div>
        <button class="smallBtn" id="useMyLocBtn" style="margin-bottom:10px">📌 استخدم موقعي الحالي</button>
        <div style="font-size:12px;margin-bottom:6px">نصف قطر القبول: <b id="radiusVal">${BASE_LOCATION?.radius || 150}</b> متر</div>
        <input type="range" id="radiusSlider" min="20" max="1000" step="10" value="${BASE_LOCATION?.radius || 150}" style="width:100%;margin-bottom:12px" />
        <div style="display:flex;gap:8px">
          <button id="saveBaseLocBtn" style="flex:1">حفظ</button>
          <button class="ghost" id="cancelBaseLocBtn" style="flex:1">إلغاء</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const startLat = BASE_LOCATION?.lat ?? 33.8886;
    const startLng = BASE_LOCATION?.lng ?? 35.4955;
    const map = L.map("pickerMap").setView([startLat, startLng], BASE_LOCATION ? 16 : 8);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);

    let marker = null, circle = null;
    let picked = BASE_LOCATION ? { lat: startLat, lng: startLng } : null;

    function placeMarker(lat, lng) {
      picked = { lat, lng };
      const radius = +document.getElementById("radiusSlider").value;
      if (marker) marker.setLatLng([lat, lng]); else marker = L.marker([lat, lng]).addTo(map);
      if (circle) circle.setLatLng([lat, lng]).setRadius(radius); else circle = L.circle([lat, lng], { radius, color: "#2DD4BF" }).addTo(map);
    }
    if (picked) placeMarker(picked.lat, picked.lng);

    map.on("click", (e) => placeMarker(e.latlng.lat, e.latlng.lng));

    document.getElementById("radiusSlider").oninput = (e) => {
      document.getElementById("radiusVal").textContent = e.target.value;
      if (circle) circle.setRadius(+e.target.value);
    };

    document.getElementById("useMyLocBtn").onclick = async () => {
      const geo = await getGeo();
      if (geo) { map.setView([geo.lat, geo.lng], 17); placeMarker(geo.lat, geo.lng); }
    };

    document.getElementById("cancelBaseLocBtn").onclick = () => overlay.remove();
    document.getElementById("saveBaseLocBtn").onclick = async () => {
      if (!picked) { alert("دوس عالخريطة أول لتحديد نقطة"); return; }
      const radius = +document.getElementById("radiusSlider").value;
      await setBaseLocation({ lat: picked.lat, lng: picked.lng, radius });
      BASE_LOCATION = await getBaseLocation();
      overlay.remove();
      renderDuty();
    };
  }

  function getGeo() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat:+pos.coords.latitude.toFixed(5), lng:+pos.coords.longitude.toFixed(5), accuracy:Math.round(pos.coords.accuracy) }),
        () => resolve(null),
        { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
      );
    });
  }

      renderRequestsTab();
    }));
    main.querySelectorAll("[data-swapreject]").forEach(btn => btn.addEventListener("click", async () => {
      await sb.from("swap_requests").update({ status:"rejected", decided_at: new Date().toISOString() }).eq("id", btn.getAttribute("data-swapreject"));
      renderRequestsTab();
    }));

    document.getElementById("reqSubmit").onclick = async () => {

      const note = document.getElementById("reqNote").value.trim();
      const errEl = document.getElementById("reqErr");

      errEl.textContent = "";
      const btn = document.getElementById("reqSubmit");
      btn.disabled = true;
      await sb.from("requests").insert({ member_id: memberId, date, type, note, status:"pending" });
      btn.disabled = false;
      renderRequestsTab();
    };

    main.querySelectorAll("[data-approve]").forEach(btn => btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-approve");
      const req = requests.find(r => r.id === id);
      await sb.from("requests").update({ status:"approved", decided_at: new Date().toISOString() }).eq("id", id);
      await upsertAttendance(req.member_id, req.date, { status: req.type, verified:false });
      renderRequestsTab();
    }));
    main.querySelectorAll("[data-reject]").forEach(btn => btn.addEventListener("click", async () => {
      await sb.from("requests").update({ status:"rejected", decided_at: new Date().toISOString() }).eq("id", btn.getAttribute("data-reject"));
      renderRequestsTab();
    }));
    main.querySelectorAll("[data-delreq]").forEach(btn => btn.addEventListener("click", async () => {
      await sb.from("requests").delete().eq("id", btn.getAttribute("data-delreq"));

    }));

  function isNowWithinShift(shiftId) {
    const s = SHIFTS.find(x => x.id === shiftId);
    if (!s) return null;
    const start = new Date(`${todayISO()}T${pad(s.start)}:00:00`);
    const end = new Date(start.getTime() + 8 * 3600 * 1000);
    const now = new Date();
    if (now < start) return "before";
    if (now >= end) return "after";
    return "within";
  }

  function renderCheckinInfo(row, pin) {
    document.body.classList.remove("cmd-theme");
    let shiftText;
    if (!row.on_duty) shiftText = "فصيلتك مستريحة هالأسبوع (سريتك مو مناوبة)";
    else if (!row.shift) shiftText = "الفصيلة مناوبة، بس لسا ما تحدد إلها نوبة معيّنة";
    else { const s = SHIFTS.find(x => x.id === row.shift); shiftText = `${s ? s.label : row.shift} (${s ? s.range : ""})`; }

    let statusBox;
    const shiftWindow = (row.on_duty && row.shift) ? isNowWithinShift(row.shift) : null;
    if (row.today_status === "present") {
      const rangeHtml = typeof row.today_in_range === "boolean"
        ? (row.today_in_range
            ? `<div style="font-size:12px;color:#2FAE60;margin-top:4px">✔ داخل نطاق القاعدة</div>`
            : `<div style="font-size:12px;color:#D64545;margin-top:4px">⚠️ خارج نطاق القاعدة (~<span class="mono">${row.today_distance_m}</span> م)</div>`)
        : "";
      const endedNote = shiftWindow === "after" ? `<div style="font-size:12px;color:#8A97A8;margin-top:6px">🌙 نوبتك خلصت لهلق</div>` : "";
      statusBox = `
        <div class="formCard" style="text-align:center">
          <div style="font-weight:800;color:#2FAE60">✅ أكدت حضورك اليوم الساعة <span class="mono">${escapeHtml(row.today_time_in||"")}</span></div>
          ${rangeHtml}${endedNote}
        </div>`;
    } else if (row.today_status && REQUEST_TYPES.includes(row.today_status)) {
      statusBox = `<div class="formCard" style="text-align:center"><div style="font-weight:800;color:${STATUS[row.today_status].color}">📋 عندك ${STATUS[row.today_status].label} مسجّلة اليوم</div></div>`;
    } else if (shiftWindow === "before") {
      const s = SHIFTS.find(x => x.id === row.shift);
      statusBox = `<div class="formCard" style="text-align:center"><div style="font-weight:800;color:#8A97A8">⏳ نوبتك لسا ما بلشت — بتبلش الساعة <span class="mono">${s?.range||""}</span></div></div>`;
    } else if (shiftWindow === "after") {
      statusBox = `<div class="formCard" style="text-align:center"><div style="font-weight:800;color:#8A97A8">🌙 نوبتك خلصت لهلق</div></div>`;
    } else {
      statusBox = `<button id="ciConfirmBtn" style="width:100%">📍 تأكيد الحضور الآن</button>`;
    }

    app.innerHTML = `

    async function loadMyRequests() {
      const box = document.getElementById("myRequestsList");

    (function setupPushUI() {
      const card = document.getElementById("pushEnableCard");
      const btn = document.getElementById("enablePushBtn");
      const statusEl = document.getElementById("pushStatus");
      if (!card || !btn || !statusEl) return;
      if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
      if (Notification.permission === "denied") {
        card.style.display = "block";
        statusEl.style.color = "#D64545";
        statusEl.textContent = "الإشعارات محظورة من إعدادات المتصفح لهالموقع — لازم تفعّليها يدويًا من إعدادات الموقع بالمتصفح.";
        btn.style.display = "none";
        return;
      }
      card.style.display = "block";
      if (Notification.permission === "granted") {
        btn.textContent = "🔁 التأكد من تفعيل الإشعارات";
        initPushSilent(row.member_id).then(() => {
          statusEl.style.color = "#2FAE60";
          statusEl.textContent = "✔ الإشعارات متزامنة على هالجهاز.";
        }).catch((e) => {
          statusEl.style.color = "#D64545";
          const detail = (e && (e.message || e.details || e.hint)) || String(e);
          statusEl.textContent = "فشلت مزامنة الإشعارات: " + detail;
        });
      }
      btn.onclick = () => enablePushNotifications(row.member_id, btn, statusEl);
    })();

    document.getElementById("toggleReqForm").onclick = () => {
      const box = document.getElementById("reqFormBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    };
    document.getElementById("toggleSwapForm").onclick = () => {
      const box = document.getElementById("swapFormBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    };
    document.getElementById("swapPartnerSearch").oninput = async (e) => {
      const q = e.target.value.trim();
      const resBox = document.getElementById("swapPartnerResults");
      if (!q) { resBox.innerHTML = ""; return; }
      const { data } = await sb.rpc("search_members_public", { p_query: q });
      const matches = (data || []).filter(m => m.id !== row.member_id);
      resBox.innerHTML = matches.map(m => `
        <div class="smallMember" data-pick="${m.id}" data-pickname="${escapeHtml(m.name)}" style="cursor:pointer">
          <span>${escapeHtml(m.name)}</span>
          <span style="font-size:11px;color:#8A97A8">${escapeHtml(m.unit_name||"")}</span>
        </div>
      `).join("");
      resBox.querySelectorAll("[data-pick]").forEach(el => el.addEventListener("click", () => {
        chosenPartnerId = el.getAttribute("data-pick");
        const chosenBox = document.getElementById("swapPartnerChosen");
        chosenBox.style.display = "block";
        chosenBox.textContent = `✔ اخترت: ${el.getAttribute("data-pickname")}`;
        resBox.innerHTML = "";
        document.getElementById("swapPartnerSearch").value = "";
      }));
    };
    document.getElementById("swapSubmitBtn").onclick = async () => {
      const date = document.getElementById("swapDate").value;
      const note = document.getElementById("swapNote").value.trim();
      const errEl = document.getElementById("swapErr");
      if (!chosenPartnerId) { errEl.textContent = "اختر الفرد يلي بدك تبدّل معه من نتائج البحث"; return; }
      if (!date) { errEl.textContent = "اختر التاريخ"; return; }
      errEl.textContent = "";
      const btn = document.getElementById("swapSubmitBtn");
      btn.disabled = true; btn.textContent = "...";
      const { error } = await sb.rpc("submit_swap_request", { p_member_id: row.member_id, p_pin: pin, p_partner_id: chosenPartnerId, p_date: date, p_note: note || null });
      btn.disabled = false; btn.textContent = "إرسال طلب التبديل";
      if (error) { errEl.textContent = "صار خطأ، جرب مرة ثانية."; return; }
      chosenPartnerId = null;
      document.getElementById("swapPartnerChosen").style.display = "none";
      document.getElementById("swapNote").value = "";
      document.getElementById("swapFormBox").style.display = "none";
      loadMySwaps();
    };

    document.getElementById("reqSubmitBtn").onclick = async () => {
      const type = document.getElementById("reqType").value;
      const date = document.getElementById("reqDate").value;
      const note = document.getElementById("reqNote").value.trim();
      const errEl = document.getElementById("reqErr");
      if (!date) { errEl.textContent = "اختر التاريخ"; return; }
      errEl.textContent = "";
      const btn = document.getElementById("reqSubmitBtn");
      btn.disabled = true; btn.textContent = "...";
      const { error } = await sb.rpc("submit_leave_request", { p_member_id: row.member_id, p_pin: pin, p_type: type, p_date: date, p_note: note || null });
      btn.disabled = false; btn.textContent = "إرسال الطلب";
      if (error) { errEl.textContent = "صار خطأ، جرب مرة ثانية."; return; }
      document.getElementById("reqNote").value = "";
      document.getElementById("reqFormBox").style.display = "none";
      loadMyRequests();
    };

    const confirmBtn = document.getElementById("ciConfirmBtn");
    if (confirmBtn) confirmBtn.onclick = async () => {
      confirmBtn.disabled = true; confirmBtn.textContent = "...جارِ تحديد الموقع";
      const geo = await getGeo();
      if (!geo) {
        confirmBtn.disabled = false; confirmBtn.textContent = "📍 تأكيد الحضور الآن";
        document.getElementById("ciConfirmErr").textContent = "لازم تسمح بالوصول للموقع لتأكيد الحضور.";
        return;
      }
      const { data: resultGeo, error } = await sb.rpc("member_checkin", {
        p_member_id: row.member_id, p_pin: pin, p_lat: geo.lat, p_lng: geo.lng, p_accuracy: geo.accuracy
      });
      if (error) {
        confirmBtn.disabled = false; confirmBtn.textContent = "📍 تأكيد الحضور الآن";
        document.getElementById("ciConfirmErr").textContent = "صار خطأ، جرب مرة ثانية.";
        return;
      }
      row.today_status = "present";
      row.today_time_in = new Date().toTimeString().slice(0,5);
      row.today_in_range = resultGeo?.in_range;
      row.today_distance_m = resultGeo?.distance_m;
      renderCheckinInfo(row, pin);
    };

    document.getElementById("ciBackBtn").onclick = () => { clearCreds(); renderCheckinChoice(); };
    document.getElementById("mySettingsBtn").onclick = () => renderMemberSettings(row, pin);
    wirePwaInstallButton();
  }

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById("pwaInstallBtn");
    if (btn) btn.style.display = "block";
  });
  function wirePwaInstallButton() {
    const btn = document.getElementById("pwaInstallBtn");
    if (!btn) return;
    if (deferredInstallPrompt) btn.style.display = "block";
    btn.onclick = async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.style.display = "none";
    };
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  function renderCommandSplash() {
    app.innerHTML = `
      <div class="cmdSplash" id="cmdSplash">
        ${SEAL_SVG.replace('class="seal"', 'class="splashSeal"')}
        <div class="splashTitle">🛡️ سجلّ الدوام</div>
        <div class="splashSub">...جارِ تجهيز لوحة القيادة</div>
        <div class="splashBar"></div>
      </div>`;
  }
  function fadeOutSplash() {
    return new Promise(resolve => {
      const el = document.getElementById("cmdSplash");
      if (!el) return resolve();
      el.classList.add("out");
      setTimeout(resolve, 350);
    });
  }

  (async () => {
    if (checkinMode) { await renderCheckinEntry(); return; }
    renderCommandSplash();
    const minWait = new Promise(resolve => setTimeout(resolve, 650));
    const [{ data: { session } }] = await Promise.all([sb.auth.getSession(), minWait]);
    await fadeOutSplash();
    if (session) await bootApp();
    else renderLogin();
  })();

</script>
</body>
</html>
